const PCATS=[
  {k:'trans',n:'교통비',ic:'✈️',days:1,timing:'pre',items:['항공권','공항 리무진','기차·KTX','렌터카','현지 택시','현지 교통','유류·통행료']},
  {k:'stay', n:'숙박비',ic:'🏨',days:'nights',timing:'pre',items:['호텔','숙소','레지던스','게스트하우스']},
  {k:'food', n:'식비',  ic:'🍽️',days:'days',timing:'local',items:['식대','조식','중식','석식','간식·음료']},
  {k:'prep', n:'준비비',ic:'🧳',days:1,timing:'pre',items:['여행자 보험','비자','로밍·유심','환전 수수료','준비물','선물 구입']},
  {k:'etc',  n:'기타',  ic:'📦',days:1,timing:'local',items:['접대비','입장료','팁','세탁','예비비']}
];
const pcat=k=>PCATS.find(c=>c.k===k)||PCATS[4];
const curPlan=()=>S.plans[S.planId];

function planDays(p){if(!p.startDate)return 1;const e=p.endDate||p.startDate;return Math.max(1,Math.round((new Date(e)-new Date(p.startDate))/864e5)+1);}
function planNights(p){return (p.nights!==undefined&&p.nights!==null&&p.nights!=='')?pnum(p.nights):Math.max(0,planDays(p)-1);}
function planHead(p){return Math.max(1,Math.round(pnum(p.headcount))||1);}
function itemPeople(p,it){return (it.people==='all'||it.people==null)?planHead(p):it.people==='half'?Math.ceil(planHead(p)/2):pnum(it.people);}
const qtyLbl=it=>it.cat==='stay'?'실':'명';
function itemDays(p,it){return it.days==='nights'?planNights(p):it.days==='days'?planDays(p):(it.days==null?1:pnum(it.days));}
function itemDayLbl(it){return it.days==='nights'?'박':it.days==='days'?'일':'회';}
const isKRW=it=>!it.currency||it.currency==='KRW';
function itemMeals(it){return it.cat==='food'?(pnum(it.meals)||1):1;} // 기존 식비(끼니 없음)는 1끼
function itemKRW(p,it){const r=isKRW(it)?1:pnum(it.rate),u=isKRW(it)?1:(pnum(it.unit)||1);return pnum(it.price)*r/u*itemPeople(p,it)*itemDays(p,it)*itemMeals(it);}
function itemForeign(p,it){return pnum(it.price)*itemPeople(p,it)*itemDays(p,it)*itemMeals(it);}
function itemFormula(p,it){
  const P=itemPeople(p,it),D=itemDays(p,it);
  const price=isKRW(it)?`${won(it.price)}원`:`${num(it.price)} ${esc(it.currency)} × ${fmtRate(it.rate)}원${pnum(it.unit)>1?'/'+num(it.unit,0):''}`;
  return `${price} × ${num(P,1)}${qtyLbl(it)} × ${num(D,1)}${itemDayLbl(it)}${it.cat==='food'?` × ${num(itemMeals(it),1)}끼`:''}`;
}
function planCalc(p){
  const head=planHead(p),r={total:0,pre:0,local:0,byCat:{},head,localCur:{},preCur:{}};
  PCATS.forEach(c=>r.byCat[c.k]={pre:0,local:0,sum:0,n:0});
  (p.items||[]).forEach(it=>{const k=itemKRW(p,it),t=it.timing==='local'?'local':'pre';
    r.total+=k;r[t]+=k;const b=r.byCat[it.cat]||(r.byCat[it.cat]={pre:0,local:0,sum:0,n:0});b[t]+=k;b.sum+=k;b.n++;
    const c=it.currency||'KRW',bag2=t==='local'?r.localCur:r.preCur;bag2[c]=(bag2[c]||0)+itemForeign(p,it);});
  r.per=r.total/head;r.prePer=r.pre/head;r.localPer=r.local/head;return r;
}

function viewPlanItems(p,c){
  const items=p.items||[];

    return `<div class="pcat"><div class="pcat-h"><span class="pc-n">${cat.ic} ${cat.n}</span><span class="pc-s">${list.length?`${won(b.sum)}원 <span class="muted">· 1인 ${won(b.sum/c.head)}</span>`:'<span class="muted">-</span>'}</span>${S.ro?'':`<button class="btn sm" data-act="addItem" data-cat="${cat.k}">+ 추가</button>`}</div>
      ${list.length?`<div class="exp-grid">${list.map(it=>planItemCard(p,it)).join('')}</div>`:''}</div>`;}).join('')
    +(items.length?'':`<p class="muted small" style="text-align:center;margin-top:14px">${S.ro?'아직 입력된 경비가 없습니다.':'분류별 <b>+ 추가</b> 또는 오른쪽 아래 <b>+ 경비 입력</b>으로 시작하세요.'}</p>`);

function viewPlanSummary(p,c){
  const pct=v=>c.total?Math.round(v/c.total*100):0;
  const rows=PCATS.map(cat=>{const b=c.byCat[cat.k];return `<tr><td class="l">${cat.ic} ${cat.n}</td><td>${b.pre?won(b.pre):'-'}</td><td>${b.local?won(b.local):'-'}</td><td><b>${won(b.sum)}</b></td><td>${won(b.sum/c.head)}</td><td class="l"><div class="bar"><i style="width:${pct(b.sum)}%"></i></div><span class="muted small">${pct(b.sum)}%</span></td></tr>`;}).join('');
  const curList=o=>{const e=Object.entries(o).filter(([k,v])=>v>0);return e.length?e.map(([k,v])=>`<div class="cl"><span>${esc(k)}</span><b>${k==='KRW'?won(v)+'원':num(v)+' '+esc(k)}</b><span class="muted small">1인 ${k==='KRW'?won(v/c.head)+'원':num(v/c.head)+' '+esc(k)}</span></div>`).join(''):'<div class="muted small">없음</div>';};
  return `<div class="sumbox"><div class="sb-row big"><span>예상 총 비용</span><b>${won(c.total)}원</b></div>
    <div class="sb-row"><span>개인 비용 (${c.head}명 기준)</span><b>${won(c.per)}원</b></div></div>
  <div class="split2">
    <div class="sumbox pre"><div class="sb-h">사전 비용 <small>출발 전 결제 · 예약</small></div><div class="sb-row"><span>합계</span><b>${won(c.pre)}원</b></div><div class="sb-row"><span>1인</span><b>${won(c.prePer)}원</b></div><div class="sb-cur">${curList(c.preCur)}</div></div>
    <div class="sumbox loc"><div class="sb-h">현지 예상 경비 <small>현지에서 쓸 돈 · 환전 참고</small></div><div class="sb-row"><span>합계</span><b>${won(c.local)}원</b></div><div class="sb-row"><span>1인</span><b>${won(c.localPer)}원</b></div><div class="sb-cur">${curList(c.localCur)}</div></div>
  </div>
  <h4 class="sec">분류별 비용</h4>
  <div class="table-wrap"><table><thead><tr><th class="l">분류</th><th>사전</th><th>현지</th><th>합계</th><th>1인</th><th class="l">비율</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td class="l">합계</td><td>${won(c.pre)}</td><td>${won(c.local)}</td><td>${won(c.total)}</td><td>${won(c.per)}</td><td></td></tr></tfoot></table></div>
  <div class="btns" style="margin-top:12px"><button class="btn sm" data-act="copyPlanSum">요약 복사</button><button class="btn sm" data-act="exportPlan">스프레드시트 내보내기</button><button class="btn sm" data-act="pdfPlan">PDF 저장</button></div>`;
}

function planDates(p){const n=Math.min(planDays(p),60),out=[];if(!p.startDate)return out;const d0=new Date(p.startDate+'T00:00:00');
  for(let i=0;i<n;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());out.push(d.toISOString().slice(0,10));}return out;}
function viewPlanSched(p){
  const sc=p.schedule||{},ds=planDates(p);
  const box=(key,label,ph)=>{const v=sc[key]||'';
    return `<div class="sday"><div class="sd-h">${label}</div>${S.ro?(v?`<div class="sd-v">${esc(v)}</div>`:'<div class="sd-v muted">-</div>'):`<textarea class="sd-t" rows="${Math.max(3,Math.min(12,(v.match(/\n/g)||[]).length+2))}" data-sched="${key}" data-keep="sch-${key}" placeholder="${ph}">${esc(v)}</textarea>`}</div>`;};
  if(!ds.length)return '<div class="empty">시작일을 정하면 일자별 일정 칸이 생깁니다.</div>';
  return (S.ro?'':'<p class="muted small" style="margin:0 2px 10px">일자별 일정을 자유롭게 적으세요. 입력하면 자동으로 저장됩니다.</p>')
    +ds.map((d,i)=>box(d,`<b>Day ${i+1}</b> <span class="muted">${d.slice(5).replace('-','/')} (${wd(d)})</span>`,'예) 09:00 인천 출발 KE451\n13:00 하노이 도착 · 호텔 체크인\n15:00 ABC Vina 미팅')).join('')
    +box('_note','<b>기타 메모</b>','준비물, 연락처, 예약 번호 등');
}

    <div data-ratesec><h4 class="sec">환율 <button type="button" class="btn sm" data-addrate>+ 환율 추가</button></h4><div data-rates></div></div>
    <p class="muted small">인원·박수를 바꾸면 ‘전체 인원’, ‘박수’, ‘일수’로 지정한 경비가 자동으로 다시 계산됩니다.</p>`,
    `<button class="btn" data-close>취소</button><button class="btn primary" data-save>${isNew?'만들기':'저장'}</button>`,el=>{
    const g=n=>el.querySelector(`[name=${n}]`);
    let scope=(isNew&&!draft)?(S.lastPlanScope||'intl'):planScope(d);
    const setScope=v=>{scope=v;el.querySelectorAll('[data-sc]').forEach(b=>b.classList.toggle('on',b.dataset.sc===v));
      const dom=v==='dom';el.querySelector('[data-ctry]').style.display=dom?'none':'';el.querySelector('[data-ratesec]').style.display=dom?'none':'';
      el.querySelector('[data-ctry]').nextElementSibling.classList.toggle('full',dom);
      g('city').placeholder=dom?'예) 부산, 제주':'예) 도쿄';};
    el.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>setScope(b.dataset.sc));setScope(scope);
    const nh=()=>{const tmp={startDate:g('startDate').value,endDate:g('endDate').value};el.querySelector('[data-nh]').textContent=`(자동 ${Math.max(0,planDays(tmp)-1)}박)`;};

    const rb=el.querySelector('[data-rates]');const draw=()=>rb.innerHTML=ratesHTML(d.rates,true);draw();
    el.querySelector('[data-addrate]').onclick=()=>rateModal(null,d.rates,r=>{d.rates.push(r);draw();});
    rb.addEventListener('click',ev=>{const b=ev.target.closest('[data-ract]');if(!b)return;const i=+b.dataset.i;

      savePlan(d);closeModal(el);if(isNew){S.view='plan';S.planId=d.id;S.planTab='items';}
      render();toast(draft?`복사해서 만들었습니다 · 경비 ${(d.items||[]).length}건`:isNew?'예상 여정을 만들었습니다':'저장했습니다');
    };
  });
}

/* 기존 여정 복사 */
function guessCat(name){const n=String(name||'');
  if(/숙박|호텔|숙소|레지던스|게스트|민박|에어비앤비|리조트/.test(n))return 'stay';
  if(/식|조식|중식|석식|점심|저녁|아침|커피|카페|음료|간식|회식|밥|술|맥주|레스토랑/.test(n))return 'food';
  if(/항공|비행|택시|교통|기차|KTX|열차|버스|지하철|렌터카|유류|주유|통행|톨|공항|그랩|우버|페리|배편/i.test(n))return 'trans';
  if(/보험|비자|유심|로밍|이심|eSIM|환전|수수료|준비/i.test(n))return 'prep';
  return 'etc';}
function planFromTrip(t,opt){
  const n=Math.max(1,(t.memberIds||[]).length);const groups={};
  (t.expenses||[]).forEach(e=>{const cat=guessCat(e.item);const cur=e.currency||'KRW';
    const key=opt.merge?`${cat}|${e.item}|${cur}`:e.id;
    const g=groups[key]||(groups[key]={cat,name:e.item,currency:cur,amount:0,rate:pnum(e.rate)||1,unit:pnum(e.unit)||1,cnt:0,memo:e.memo||''});
    g.amount+=pnum(e.amount);g.cnt++;});
  const items=Object.values(groups).map(g=>{const c=pcat(g.cat);const per=opt.perPerson;
    const timing=g.cat==='trans'&&/택시|버스|지하철|그랩|우버|현지|톨|통행|주유|유류|페리|툭툭|오토바이/i.test(g.name)?'local':c.timing;
    return{id:uid(),cat:g.cat,name:g.name,timing,currency:g.currency,price:Math.round((per?g.amount/n:g.amount)*100)/100,
      rate:g.currency==='KRW'?1:g.rate,unit:g.currency==='KRW'?1:g.unit,people:per?'all':1,days:1,meals:g.cat==='food'?1:'',
      memo:[g.cnt>1?`실제 ${g.cnt}건 합계`:'',g.cnt===1?g.memo:''].filter(Boolean).join(' · '),createdAt:Date.now()};});
  return{id:uid(),scope:KOREA.includes(t.country)?'dom':'intl',name:(t.name||'')+' (예상)',startDate:t.startDate||today(),endDate:t.endDate||t.startDate||today(),country:t.country||'',city:t.city||'',
    company:t.company||'',purpose:t.purpose||'',headcount:n,nights:'',memo:t.memo||'',rates:clone(t.rates||[]),items,schedule:{},fromTripId:t.id,createdAt:Date.now()};
}
function planCopy(p){const d=clone(p);d.id=uid();d.name=(p.name||'')+' (복사)';d.items=(d.items||[]).map(it=>({...it,id:uid()}));d.createdAt=Date.now();delete d.updatedAt;delete d.fromTripId;return d;}

    const go=el.querySelector('[data-go]'),opt=el.querySelector('[data-topt]');
    el.addEventListener('change',e=>{if(e.target.name!=='src')return;go.disabled=false;opt.hidden=!e.target.value.startsWith('trip:');

    ['예상 총 비용(원)',Math.round(c.total)],['개인 비용(원)',Math.round(c.per)],['사전 비용(원)',Math.round(c.pre)],['사전 비용 1인(원)',Math.round(c.prePer)],['현지 예상 경비(원)',Math.round(c.local)],['현지 예상 경비 1인(원)',Math.round(c.localPer)]];

    ...PCATS.flatMap(cat=>(p.items||[]).filter(it=>it.cat===cat.k).map(it=>{const k=itemKRW(p,it);return[cat.n,it.name,T(it.timing),it.currency||'KRW',pnum(it.price),isKRW(it)?1:(pnum(it.unit)||1),isKRW(it)?1:pnum(it.rate),`${itemPeople(p,it)}${qtyLbl(it)}`,`${itemDays(p,it)}${itemDayLbl(it)}`,it.cat==='food'?itemMeals(it):'',Math.round(k),Math.round(k/c.head),isKRW(it)?'':itemForeign(p,it),it.memo||''];}))];
  const sum=[['분류','사전','현지','합계','1인','비율(%)'],...PCATS.map(cat=>{const b=c.byCat[cat.k];return[cat.n,Math.round(b.pre),Math.round(b.local),Math.round(b.sum),Math.round(b.sum/c.head),c.total?Math.round(b.sum/c.total*100):0];}),['합계',Math.round(c.pre),Math.round(c.local),Math.round(c.total),Math.round(c.per),100],
    [],['현지 필요 통화','합계','1인'],...Object.entries(c.localCur).filter(([k,v])=>v>0).map(([k,v])=>[k,v,v/c.head])];
  const sc=p.schedule||{};
  const sched=[['일자','요일','일정'],...planDates(p).map((d,i)=>[`Day ${i+1} ${d}`,wd(d),sc[d]||'']),['기타 메모','',sc._note||'']];
  return[['계획정보',info],['예상경비',items],['비용요약',sum],['일정',sched]];
}
function planSummaryTSV(p){const c=planCalc(p);return toTSV([['예상 여정',p.name],['기간',dateRange(p)],['인원',planHead(p)+'명'],['예상 총 비용',won(c.total)+'원'],['개인 비용',won(c.per)+'원'],['사전 비용',won(c.pre)+'원 (1인 '+won(c.prePer)+'원)'],['현지 예상 경비',won(c.local)+'원 (1인 '+won(c.localPer)+'원)'],[],...planSheets(p)[2][1]]);}

/* ---------- PDF 출력 (캔버스로 페이지를 그려 JPEG로 담는 방식 · 한글 글꼴 문제 없음) ---------- */
const PDF_FONT='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif';
const PW=1240,PH=1754,PM=84,PFOOT=56; // A4 · 150dpi
class PdfPages{
  constructor(title){this.title=title;this.pages=[];this.newPage();}
  newPage(){const c=document.createElement('canvas');c.width=PW;c.height=PH;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,PW,PH);g.textBaseline='alphabetic';
    this.c=c;this.g=g;this.y=PM;this.pages.push(c);}
  font(size,weight){this.g.font=`${weight||400} ${size}px ${PDF_FONT}`;}
  room(){return PH-PM-PFOOT-this.y;}
  ensure(h){if(h>this.room()){this.newPage();return true;}return false;}
  wrap(str,maxW,size,weight){this.font(size,weight);const out=[];String(str??'').split('\n').forEach(par=>{let line='';
      for(const ch of [...par]){const t=line+ch;if(this.g.measureText(t).width>maxW&&line){out.push(line);line=ch.trimStart();}else line=t;}out.push(line);});return out;}
  text(str,x,y,o={}){this.font(o.size||22,o.weight);const g=this.g;g.fillStyle=o.color||'#1b2130';g.textAlign=o.align||'left';
    let s=String(str??'');if(o.maxW){while(s.length>1&&g.measureText(s).width>o.maxW)s=s.slice(0,-2)+'…';}g.fillText(s,x,y);g.textAlign='left';}
  rect(x,y,w,h,fill,stroke){const g=this.g;if(fill){g.fillStyle=fill;g.fillRect(x,y,w,h);}if(stroke){g.strokeStyle=stroke;g.lineWidth=1.5;g.strokeRect(x+.5,y+.5,w-1,h-1);}}
  rrect(x,y,w,h,r,fill,stroke){const g=this.g;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
    if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=1.5;g.stroke();}}
  tag(txt,x,y,bg,fg){this.font(18,700);const w=this.g.measureText(txt).width+18;this.rrect(x,y-22,w,30,7,bg);this.text(txt,x+9,y-1,{size:18,weight:700,color:fg});return w;}
  section(title,sub){this.ensure(110);this.y+=22;this.text(title,PM,this.y+30,{size:28,weight:700});
    if(sub){this.font(28,700);const w=this.g.measureText(title).width;this.text(sub,PM+w+14,this.y+30,{size:18,color:'#6b7280'});}
    this.y+=48;}
  // cols: [{t,w(0~1),a:'l'|'r'|'c'}], rows: [[cell...]] cell = string | {v,color,bold,bg}
  table(cols,rows,o={}){
    const W=PW-2*PM,fs=o.size||19,lh=Math.round(fs*1.45),pad=12,xs=[];let x=PM;cols.forEach(c=>{xs.push(x);x+=c.w*W;});
    const head=()=>{const h=lh+pad*1.4;this.rect(PM,this.y,W,h,'#f1f3f6');cols.forEach((c,i)=>{const cw=c.w*W;
        this.text(c.t,c.a==='r'?xs[i]+cw-pad:c.a==='c'?xs[i]+cw/2:xs[i]+pad,this.y+h/2+fs*0.36,{size:fs-1,weight:700,color:'#4b5563',align:c.a==='r'?'right':c.a==='c'?'center':'left'});});
      this.y+=h;};
    head();
    rows.forEach((r,ri)=>{const cells=r.map(v=>typeof v==='object'&&v!==null?v:{v});
      const lines=cells.map((c,i)=>c.wrap===false?[String(c.v??'')]:this.wrap(c.v,cols[i].w*W-pad*2,fs,c.bold?700:400));
      const n=Math.max(1,...lines.map(l=>l.length)),h=n*lh+pad*1.2;
      if(this.ensure(h)){head();}
      const bg=cells.find(c=>c.rowBg)?.rowBg||(o.zebra&&ri%2?'#fafbfc':null);if(bg)this.rect(PM,this.y,W,h,bg);
      cells.forEach((c,i)=>{const cw=cols[i].w*W,a=cols[i].a;lines[i].forEach((ln,k)=>{
        this.text(ln,a==='r'?xs[i]+cw-pad:a==='c'?xs[i]+cw/2:xs[i]+pad,this.y+pad*0.6+lh*(k+1)-lh*0.28,{size:fs,weight:c.bold?700:400,color:c.color,align:a==='r'?'right':a==='c'?'center':'left',maxW:c.wrap===false?cw-pad*2:undefined});});});
      this.g.fillStyle='#e3e6eb';this.g.fillRect(PM,this.y+h-1,W,1.5);this.y+=h;});
    this.y+=8;
  }

function qrCanvas(text,size){const {n,dark}=qrMatrix(text),m=4,sc=Math.max(1,Math.floor(size/(n+2*m))),S2=(n+2*m)*sc;
  const c=document.createElement('canvas');c.width=S2;c.height=S2;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,S2,S2);g.fillStyle='#111';

function buildPdf(canvases){ // 최소 PDF 작성기: 페이지마다 JPEG 한 장
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length;};
  const obj=(id,body)=>{offs[id]=len;push(`${id} 0 obj\n`);body();push('\nendobj\n');};
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const N=canvases.length,pageIds=canvases.map((_,i)=>3+i*3);
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${pageIds.map(p=>p+' 0 R').join(' ')}] /Count ${N} >>`));
  canvases.forEach((c,i)=>{const pid=pageIds[i],iid=pid+1,cid=pid+2;
    const b64=c.toDataURL('image/jpeg',0.9).split(',')[1],bin=atob(b64),jpg=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)jpg[k]=bin.charCodeAt(k);
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream');});
    const cs=`q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;obj(cid,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));});
  const maxId=2+N*3,xref=len;let x=`xref\n0 ${maxId+1}\n0000000000 65535 f \n`;for(let i=1;i<=maxId;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x);push(`trailer\n<< /Size ${maxId+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

const GH_KEY='trip-settle:gh';
const GH_DEF={repo:GH_REPO_DEFAULT,branch:'main',token:'',auto:true,last:0,lastErr:''};
function ghCfg(){try{return Object.assign({},GH_DEF,JSON.parse(localStorage.getItem(GH_KEY)||'{}'));}catch(e){return Object.assign({},GH_DEF);}}
function ghSet(o){try{localStorage.setItem(GH_KEY,JSON.stringify(Object.assign(ghCfg(),o)));}catch(e){}}
function ghAvail(){return S.store!=='db';} // claude.ai 안에서는 외부 주소 호출이 막혀 있음
function b64(str){const by=new TextEncoder().encode(str);let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin);}
async function ghApi(path,opt){const c=ghCfg();
  return fetch('https://api.github.com/repos/'+c.repo+path,Object.assign({},opt,{headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'},(opt||{}).headers||{})}));}
function ghErrText(st){return st===401?'토큰이 올바르지 않거나 만료되었습니다':st===403?'토큰에 쓰기 권한(Contents: Read and write)이 없습니다':st===404?'저장소를 찾을 수 없습니다 (저장소 이름·토큰의 저장소 선택 확인)':st===409?'저장 충돌 — 잠시 후 다시 시도하세요':'GitHub 오류 '+st;}
async function ghPut(path,content,msg){
  const c=ghCfg(),enc=b64(content),p='/contents/'+path.split('/').map(encodeURIComponent).join('/');let sha;
  const g=await ghApi(p+'?ref='+encodeURIComponent(c.branch));
  if(g.ok){const j=await g.json();sha=j.sha;if(j.content&&j.content.replace(/\s/g,'')===enc)return false;}
  else if(g.status!==404)throw new Error(ghErrText(g.status));
  const r=await ghApi(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:enc,branch:c.branch,sha})});
  if(!r.ok)throw new Error(ghErrText(r.status));return true;
}

    people:Object.values(S.people).map(strip).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'))};

let ghTimer=null,ghBusy=false;
function ghSchedule(){const c=ghCfg();if(!ghAvail()||!c.token||!c.auto||!isEditor())return;clearTimeout(ghTimer);ghTimer=setTimeout(()=>ghBackup(false),30000);}
async function ghBackup(manual){
  const c=ghCfg();if(!c.token){if(manual)toast('먼저 GitHub 토큰을 저장하세요',true);return;}
  if(ghBusy){ghSchedule();return;}ghBusy=true;
  const stamp=new Date().toLocaleString('ko-KR'),d=backupData();
  try{let n=0;
    if(await ghPut('data/trips.json',jsonLines(d.trips),`백업: 출장/여행 ${d.trips.length}건 (${stamp})`))n++;
    if(await ghPut('data/plans.json',jsonLines(d.plans),`백업: 비용 검토 ${d.plans.length}건 (${stamp})`))n++;
    if(S.got&&S.got.people||S.store==='local')if(await ghPut('data/people.json',jsonLines(d.people),`백업: 인원 정보 ${d.people.length}명 (${stamp})`))n++;
    ghSet({last:Date.now(),lastErr:''});
    if(manual)toast(n?`GitHub 백업 완료 (${n}개 파일 갱신)`:'GitHub 백업이 최신 상태입니다 (변경 없음)');
  }catch(e){ghSet({lastErr:e.message});toast('GitHub 백업 실패: '+e.message,true);}
  finally{ghBusy=false;const b=document.querySelector('[data-ghinfo]');if(b)b.innerHTML=ghInfo();}
}
function ghInfo(){const c=ghCfg();return (c.last?'마지막 백업: '+new Date(c.last).toLocaleString('ko-KR'):'아직 백업하지 않았습니다')+(c.lastErr?` · <span style="color:var(--danger)">최근 오류: ${esc(c.lastErr)}</span>`:'');}
async function fetchBackup(name){
  const c=ghCfg();const urls=[];
  if(/github\.io$/i.test(location.hostname))urls.push('data/'+name);
  urls.push(`https://raw.githubusercontent.com/${c.repo}/${c.branch}/data/${name}`);
  for(const u of urls){try{const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}}
  return null;
}
async function restoreFrom(d,label){
  const trips=(d.trips||[]).filter(x=>x&&x.id),plans=(d.plans||[]).filter(x=>x&&x.id),people=(d.people||[]).filter(x=>x&&x.id);
  if(!trips.length&&!plans.length&&!people.length){toast('불러올 데이터가 없습니다',true);return;}
  const over=trips.filter(t=>S.trips[t.id]).length+plans.filter(p=>S.plans[p.id]).length+people.filter(p=>S.people[p.id]).length;
  askConfirm(`${label}에서 불러옵니다.\n여정 ${trips.length}건 · 비용 검토 ${plans.length}건 · 인원 ${people.length}명${over?`\n(같은 항목 ${over}건은 백업 내용으로 덮어씁니다)`:''}`,()=>{
    people.forEach(p=>{S.people[p.id]=p;scheduleSave('people',p.id);});
    trips.forEach(t=>{S.trips[t.id]=t;scheduleSave('trips',t.id);});
    plans.forEach(p=>{S.plans[p.id]=p;scheduleSave('plans',p.id);});
    closeModal();render();toast(`불러오기 완료 · 여정 ${trips.length} · 비용 검토 ${plans.length} · 인원 ${people.length}`);},'불러오기');
}

  if(prb){if(S.ro)return;const i=+prb.dataset.i;const p=curPlan();const r=(p.rates||[])[i];if(!r)return;
    if(prb.dataset.ract==='edit')rateModal(r,p.rates,nr=>{const q=clone(curPlan());q.rates[i]=nr;savePlan(q);render();toast('환율을 수정했습니다');});
    else askConfirm(`${r.code} 환율을 삭제할까요?\n이미 입력된 경비의 환율은 그대로 유지됩니다.`,()=>{const q=clone(curPlan());q.rates.splice(i,1);savePlan(q);render();});
    return;}
  const rb=e.target.closest('#trip-rates [data-ract]');
  if(rb&&S.ro)return;
  if(rb){const i=+rb.dataset.i;const t=cur();const r=(t.rates||[])[i];if(!r)return;
    if(rb.dataset.ract==='edit')rateModal(r,t.rates,nr=>{const d=clone(cur());d.rates[i]=nr;saveTrip(d);render();toast('환율을 수정했습니다');});
    else askConfirm(`${r.code} 마스터 환율을 삭제할까요?\n이미 입력된 지출의 결제환율은 그대로 유지됩니다.`,()=>{const d=clone(cur());d.rates.splice(i,1);saveTrip(d);render();});
    return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  if(S.ro&&!RO_OK.has(b.dataset.act))return;
  const f=ACT[b.dataset.act];if(f)f(b.dataset,b,e);
});
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-pcat]');if(!b)return;S.pcat=b.dataset.pcat;$('#plist').innerHTML=peopleListHTML();});
$('#app').addEventListener('input',e=>{
  const sd=e.target.closest&&e.target.closest('[data-sched]');
  if(sd&&!S.ro){const p=S.plans[S.planId];if(p){p.schedule={...(p.schedule||{}),[sd.dataset.sched]:sd.value};scheduleSaveSoon('plans',p.id,900);
    sd.rows=Math.max(3,Math.min(12,(sd.value.match(/\n/g)||[]).length+2));}return;}if(e.target.id==='pq'){S.pq=e.target.value;$('#plist').innerHTML=peopleListHTML();}});
$('#modal-root').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const k=b.dataset.act;if(['copyLink','saveQR','previewView'].includes(k))ACT[k](b.dataset);});
document.addEventListener('click',e=>{const b=e.target.closest('#modebar [data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b,e);});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.view;render();window.scrollTo(0,0);});
$('#app').addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.sched)flushSoon();});
window.addEventListener('pagehide',flushSoon);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length)closeModal();});
init();
</script>
</body>
</html>
