<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출장/여행 비용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#1b2130;--muted:#6b7280;--line:#e3e6eb;
  --accent:#2456d3;--accent-ink:#fff;--accent-soft:#e9effc;
  --plus:#c2410c;--plus-soft:#fff1e8;--minus:#047857;--minus-soft:#e7f7ef;--danger:#d92d20;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.banner{background:#16213d;color:#fff;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}
.banner h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px}
.status{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.status.ok{background:#1f7a4d}.status.local{background:#8a5a00}.status.err{background:#a3261b}
.tabs{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;padding:0 calc(8px + env(safe-area-inset-left))}
.tabs button{flex:0 0 auto;border:0;background:none;padding:12px 16px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:16px calc(14px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
h2{margin:0;font-size:20px}
h3{margin:0;font-size:17px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:#f7f8fa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.trip-card{display:flex;flex-direction:column;gap:10px;padding:0;overflow:hidden}
.tc-main{padding:14px 14px 0;cursor:pointer}
.tc-title{font-weight:700;font-size:16px}
.tc-meta,.muted{color:var(--muted)}
.tc-meta{font-size:13px;margin-top:2px}
.tc-purpose{font-size:13px;margin-top:6px;min-height:1em}
.tc-stats{display:flex;gap:10px;align-items:baseline;margin-top:10px;font-size:13px;color:var(--muted)}
.tc-stats b{margin-left:auto;color:var(--ink);font-size:16px}
.tc-actions{display:flex;gap:6px;justify-content:flex-end;border-top:1px solid var(--line);padding:8px 10px;background:#fafbfc}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.small{font-size:12.5px}
.crumb{margin-bottom:8px}
.trip-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px}
.trip-head h3{font-size:16px;line-height:1.3}
.th-info{flex:1;min-width:0}
.trip-head .meta{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
.trip-head .meta.clamp{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.th-btns{margin-top:8px;gap:4px}
.th-btns .btn.sm{padding:4px 8px;font-size:12.5px}
.th-qr{flex:0 0 auto;width:92px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px 4px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.th-qr svg{display:block;width:82px;height:82px}
.th-qr span{font-size:11px;color:var(--muted)}
.th-qr:hover{border-color:var(--accent)}
.dash{position:sticky;top:46px;z-index:15;margin:12px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 14px rgba(20,30,60,.07)}
.dash>div{background:#fff;padding:10px 12px}
.dash .k{font-size:12px;color:var(--muted)}
.dash .v{font-size:19px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.dash .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.dash .total .v{color:var(--accent)}
.dash-sub{grid-column:1/-1;font-size:12px;color:var(--muted);padding:6px 12px!important}
.subtabs{display:flex;gap:4px;background:#e6e8ec;border-radius:10px;padding:3px;margin-bottom:12px;overflow-x:auto}
.subtabs button{flex:1;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.subtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 2px 6px;font-weight:500}
.exp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:4px}
.exp{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;min-width:0}
.exp-item{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-amt{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-top:2px;white-space:nowrap}
.exp-amt small{font-size:12px;font-weight:500;color:var(--muted);margin-left:1px}
.exp-fx{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-memo{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-row{display:flex;gap:6px;font-size:12px;margin-top:5px;line-height:1.35}
.exp-row .lbl{width:auto;flex:0 0 auto;font-size:11.5px}
.exp-row .v{min-width:0;overflow-wrap:anywhere}
.pay-t{color:var(--minus);font-weight:500}
.warn-t{color:#8a5a00;background:#fff4d6;border-radius:6px;padding:0 5px}
.exp .exp-act{margin-top:auto;padding-top:6px}
.exp .exp-act .btn{padding:3px 9px;font-size:12px}
.exp-top{display:flex;justify-content:space-between;gap:12px}
.exp-top .amt{text-align:right;white-space:nowrap}
.exp-top .amt b{font-size:16px}
.exp-people{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px;font-size:13px}
.lbl{font-size:12px;color:var(--muted);width:34px;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:#f0f2f5;border-radius:99px;padding:2px 9px;font-size:12.5px}
.chip.pay{background:var(--minus-soft);color:var(--minus)}
.chip.warn{background:#fff4d6;color:#8a5a00}
.exp-act{display:flex;justify-content:flex-end;gap:4px}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;border:0;background:var(--accent);color:#fff;border-radius:99px;padding:14px 20px;font-weight:700;box-shadow:0 8px 22px rgba(36,86,211,.35);cursor:pointer}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#f7f8fa;font-weight:500;color:var(--muted);font-size:12.5px}
td.l,th.l{text-align:left}
tfoot td{font-weight:700;background:#fafbfc;border-bottom:0}
.plus{color:var(--plus)}.minus{color:var(--minus)}
.net{font-weight:700}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px;font-size:14.5px}
.sec small{font-weight:400;color:var(--muted)}
.legend{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.xfer{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.xfer:last-child{border-bottom:0}
.xfer b{margin-left:auto}
.rate-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px}
.rc{min-width:70px}.rc b{display:block;font-size:15px}.rc small{color:var(--muted);font-size:12px}
.rv{flex:1;text-align:right}
.rv .big{font-weight:700;font-size:16px}
.rv .unit{font-size:11.5px;color:var(--muted);line-height:1.2}
.ra{display:flex;gap:4px}
.person{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff}
.person:last-child{border-bottom:0}
.person .pn{font-weight:700}
.person .pi{flex:1;min-width:0}
.person .pd{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:10px}
.note{background:#fff8e6;border:1px solid #f3dfa6;color:#6b4a00;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
/* modal */
#modal-root .overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:580px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head .x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px 8px}
.sheet-body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.f.full{grid-column:1/-1}
.f input,.f select,.f textarea,.inp{border:1px solid #d5d9e0;border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink);font-size:15px;width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus,.search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.inline{display:flex;gap:6px}
.hint{font-weight:400;font-size:12px;color:var(--muted)}
.plist{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow-y:auto;padding:2px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px 6px 9px;cursor:pointer;font-size:14px;background:#fff;user-select:none}
.chk input{margin:0;accent-color:var(--accent)}
.chk small{color:var(--muted);font-size:12px}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk.pay:has(input:checked){border-color:var(--minus);background:var(--minus-soft)}
.quick{display:flex;gap:6px;margin-top:10px}
.quick input{flex:1;border:1px solid #d5d9e0;border-radius:9px;padding:7px 10px;min-width:0}
.krw-preview{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.krw-preview b{font-size:16px}
.seg{display:flex;background:#e6e8ec;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink)}
.mode{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:13.5px}
.preview table{font-size:12.5px}
.preview{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.preview:empty{display:none}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:#eef}
.tag.new{background:#e7f7ef;color:var(--minus)}.tag.upd{background:#e9effc;color:var(--accent)}.tag.same{background:#f0f2f5;color:var(--muted)}.tag.del{background:#fde8e6;color:var(--danger)}
textarea.paste,.copybox{width:100%;border:1px solid #d5d9e0;border-radius:9px;padding:9px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{text-align:left;padding:12px 14px}
.menu-list .btn small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}

.catbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.catbar:empty{display:none}
.catbar button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.catbar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.catpick{display:flex;flex-wrap:wrap;gap:5px}
.catpick .chk{padding:5px 11px 5px 8px;font-size:13px;color:var(--ink)}
.gtag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px;vertical-align:1px}
.g-co{background:#e9effc;color:#2456d3}.g-fa{background:#fdeaf1;color:#b4235a}.g-fr{background:#e7f7ef;color:#047857}
.g-ac{background:#f3ecfd;color:#6d3fc4}.g-cl{background:#fff1e8;color:#c2410c}.g-et{background:#f0f2f5;color:#555}
body.linkview #tabs,body.linkview #modebar{display:none}
body.linkview .dash{top:0}
.ro-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#eef2ff;border:1px solid #d6dcff;color:#2b3a8f;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
.qr-card{margin-top:22px}
.qr-wrap{display:flex;gap:16px;align-items:flex-start}
.qr{flex:0 0 168px;width:168px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.qr svg{display:block;width:100%;height:auto}
.qr-info{flex:1;min-width:0}
.qr-url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);word-break:break-all;background:#f7f8fa;border-radius:8px;padding:6px 8px;margin-bottom:8px}
@media (max-width:640px){.qr-wrap{flex-direction:column;align-items:center}.qr{flex-basis:auto;width:210px}}
.acct{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff}
.acct:last-child{border-bottom:0}
.acct-i{flex:1;min-width:0}
.acct-who{display:flex;gap:6px;align-items:center;margin-bottom:2px}
.acct-who:empty{display:none}
.acct-num{font-size:15.5px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2px}
.acct-b{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.acct-num .mono{white-space:nowrap}
@media (max-width:640px){.acct{flex-wrap:wrap}.acct-b{width:100%}}
.xfer-acct{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 9px;margin-top:-4px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.list .xfer:has(+ .xfer-acct){border-bottom:0}
.tparse{padding:10px 12px;margin-top:8px}
.tparse.bad{border-color:#f3c2bd;background:#fffafa}
.tp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tp-g{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.tp-g>span:nth-child(odd){color:var(--muted);font-size:12px}
.chips-w{display:flex;flex-wrap:wrap;gap:4px}
.ptag{display:inline-block;font-size:11px;font-weight:700;color:#7a4b00;background:#fff1cc;border-radius:6px;padding:1px 6px;vertical-align:2px}
.pdash{position:sticky;top:46px;z-index:15;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 14px rgba(20,30,60,.07)}
body.linkview .pdash{top:0}
.pdash>div{background:#fff;padding:9px 12px}
.pdash .k{font-size:12px;color:var(--muted)}
.pdash .v{font-size:20px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.pdash .v.acc{color:var(--accent)}
.pdash .v small,.pdash .v2 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.pdash .pd-sub{padding:7px 12px}
.pdash .pd-sub.pre{background:#f4f7ff}.pdash .pd-sub.loc{background:#f2fbf6}
.pdash .pd-sub .k{font-weight:500}
.pdash .pd-sub.pre .k{color:#2456d3}.pdash .pd-sub.loc .k{color:#047857}
.pdash .v2{font-size:16px;font-weight:700;white-space:nowrap}
.pdash .pp{font-size:12px;color:var(--muted)}
.pdash .pd-foot{grid-column:1/-1;font-size:12px;color:var(--muted);padding:5px 12px}
.pcat{margin-bottom:10px}
.pcat-h{display:flex;align-items:center;gap:8px;margin:14px 2px 6px}
.pc-n{font-weight:700;font-size:14.5px}
.pc-s{margin-left:auto;font-size:13px;font-weight:500;white-space:nowrap}
.tbadge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 5px;vertical-align:1px}
.tbadge.pre{background:#e9effc;color:#2456d3}.tbadge.loc{background:#e7f7ef;color:#047857}
.sumbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:10px}
.sumbox.pre{border-top:3px solid #2456d3}.sumbox.loc{border-top:3px solid #047857}
.sb-h{font-weight:700;margin-bottom:4px}.sb-h small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.sb-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sb-row.big{font-size:16px}.sb-row.big b{color:var(--accent);font-size:19px}
.sb-cur{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.cl{display:grid;grid-template-columns:44px 1fr auto;gap:6px;font-size:13px;padding:2px 0;align-items:baseline}
.cl b{text-align:right}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:inline-block;width:70px;height:7px;background:#eef0f3;border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.sday{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.sd-h{font-size:13.5px;margin-bottom:6px}
.sd-t{width:100%;border:1px solid #d5d9e0;border-radius:9px;padding:8px 10px;font-size:14px;line-height:1.5;resize:vertical}
.sd-t:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.sd-v{white-space:pre-wrap;font-size:14px;line-height:1.55}
.catseg{flex-wrap:wrap}
.catseg button{flex:1 1 auto;font-size:13px;padding:7px 6px}
.tseg{margin:0}.tseg button{padding:7px 4px}
.tseg button.on[data-tm2=pre]{color:#2456d3}.tseg button.on[data-tm2=local]{color:#047857}
.chk.mini{border:0;padding:4px 0 0;background:none;font-size:12px;color:var(--muted)}
.chk.mini:has(input:checked){background:none}

        case QRMaskPattern.PATTERN010 : return j % 3 === 0;

            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;

            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;

                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                            continue;
                        }

                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }

                }

                }

            for (col = 0; col < moduleCount - 6; col++) {

                        !qrCode.isDark(row, col + 1) &&

                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&

                         qrCode.isDark(row + 6, col) ) {

                }

            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }

    }

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;
};

/* ===== 배포 설정 =====
   GitHub Pages(*.github.io)에서 열면 Firebase(Firestore + 로그인)에 저장하고,
   claude.ai에서 열면 claude 서버 DB에 저장합니다. 같은 index.html 하나로 동작합니다. */
const FIREBASE_CONFIG = null; /*FIREBASE_CONFIG*/
const FB_VER='10.12.2';
const GH_REPO_DEFAULT='intiipu-prog/Tripmanagment';
function useFirebase(){return /github\.io$/i.test(location.hostname)||/[?&]fb=1\b/.test(location.search);}
function isEditor(){return !!S.editor&&!S.viewOnly;}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]')){res();return;}const x=document.createElement('script');x.src=src;x.onload=res;x.onerror=()=>rej(new Error('스크립트를 불러오지 못했습니다'));document.head.appendChild(x);});}
// Firestore를 claude DB와 같은 모양으로 감싼다 (문서는 {json, updatedAt}로 저장)
function fbAdapter(fs){
  const wrap=d=>({id:d.id,exists:d.exists,metadata:d.metadata||{},data:()=>{const x=d.data();if(!x)return undefined;if(typeof x.json==='string'){try{return JSON.parse(x.json);}catch(e){return {};}}return x;}});
  const docRef=(col,id)=>{const r=fs.collection(col).doc(id);return{id,
    set:data=>r.set({json:JSON.stringify(data),updatedAt:Date.now()}),delete:()=>r.delete(),
    onSnapshot:(n,e)=>r.onSnapshot(s=>n(wrap(s)),e)};};
  const api={collection:col=>({doc:id=>docRef(col,id),onSnapshot:(n,e)=>fs.collection(col).onSnapshot(qs=>n({docs:qs.docs.map(wrap),metadata:qs.metadata||{}}),e)}),
    doc:path=>{const i=path.indexOf('/');return docRef(path.slice(0,i),path.slice(i+1));}};
  return api;
}

const bag=col=>S[col]||(S[col]={});
const over={},ver={},pending={};
let chain=Promise.resolve();
function scheduleSave(col,id){
  const key=col+'/'+id, obj=bag(col)[id];
  over[key]=obj?clean(obj):null; ver[key]=(ver[key]||0)+1;
  if(!Store.db){persistLocal();delete over[key];ghSchedule();return;}
  if(pending[key])return; pending[key]=true;
  chain=chain.then(async()=>{
    pending[key]=false; const v=ver[key]; const data=over[key];
    const ref=Store.db.collection(col).doc(id);
    try{ await writeOnce(ref,data); }
    catch(err){ delete over[key]; writeErr(err); render(); return; }
    if(ver[key]===v) delete over[key];
    ghSchedule();
  });
}
const debT={};
function scheduleSaveSoon(col,id,ms){ // 입력 중에는 화면 상태만 먼저 고정하고, 멈추면 한 번 저장
  const key=col+'/'+id,obj=bag(col)[id];over[key]=obj?clean(obj):null;ver[key]=(ver[key]||0)+1;
  clearTimeout(debT[key]);debT[key]=setTimeout(()=>{delete debT[key];scheduleSave(col,id);},ms||900);
}
function flushSoon(){Object.keys(debT).forEach(k=>{clearTimeout(debT[k]);delete debT[k];const i=k.indexOf('/');scheduleSave(k.slice(0,i),k.slice(i+1));});}
async function writeOnce(ref,data){
  const go=()=>data?ref.set(data):ref.delete();
  try{await go();}catch(e){ if(e&&e.code==='unavailable'){await sleep(400+Math.random()*900);await go();} else throw e; }
}
function clean(o){const c=clone(o);delete c.id;return c;}
function writeErr(err){const c=err&&err.code;
  if(c==='permission-denied'||c==='unauthenticated'){toast('편집자 로그인이 필요합니다 (저장되지 않았습니다)',true);return;}
  toast(c==='invalid_argument'?'저장 권한이 없거나 데이터 형식 오류입니다.':c==='quota_exceeded'?'저장 공간 한도를 초과했습니다. 오래된 출장을 삭제해 주세요.':c==='resource_exhausted'?'요청이 많습니다. 잠시 후 다시 시도하세요.':'서버 저장에 실패했습니다. 잠시 후 다시 시도하세요.',true);}
function persistLocal(){try{localStorage.setItem(LKEY,JSON.stringify({people:S.people,trips:S.trips,plans:S.plans}));}catch(e){}}
function applySnap(col,snap){
  const b={}; snap.docs.forEach(d=>{b[d.id]={...clone(d.data()),id:d.id};});
  Object.keys(over).forEach(k=>{const i=k.indexOf('/');if(k.slice(0,i)!==col)return;const id=k.slice(i+1);if(over[k])b[id]={...clone(over[k]),id};else delete b[id];});
  S[col]=b;
}
function savePerson(p){S.people[p.id]=p;scheduleSave('people',p.id);}
function deletePerson(id){delete S.people[id];scheduleSave('people',id);}
function saveTrip(t){
  t.memberIds=[...new Set(t.memberIds||[])];
  t.members=t.memberIds.map(id=>{const p=S.people[id];const old=(t.members||[]).find(m=>m.id===id)||{};return{id,name:p?p.name:(old.name||'(삭제된 인원)'),team:p?(p.team||''):(old.team||'')};});
  t.updatedAt=Date.now(); S.trips[t.id]=t; scheduleSave('trips',t.id);
}
function deleteTrip(id){delete S.trips[id];scheduleSave('trips',id);}
function setStatus(txt,cls){if(S.ro&&cls!=='err'){txt='조회 전용';cls='ok';}const s=$('#status');s.textContent=txt;s.className='status '+(cls||'');}

const subs={};
function subscribe(col){
  if(subs[col]||!Store.db)return;
  subs[col]=Store.db.collection(col).onSnapshot(snap=>{
    applySnap(col,snap);S.got[col]=true;
    const need=['trips','plans'].concat(S.editor?['people']:[]);
    if(need.every(c=>S.got[c])){if(!snap.metadata.fromCache){clearTimeout(S.slowT);S.slow=false;}if(S.mode==='loading')S.mode='ready';}
    if(S.mode==='ready')render();
  },err=>{clearTimeout(S.slowT);S.mode='ready';if(col==='people'&&S.store==='fb'){S.people={};render();return;}setStatus('서버 오류','err');S.dbErr=true;render();});
}
function unsubscribe(col){if(subs[col]){try{subs[col]();}catch(e){}delete subs[col];}S.got[col]=false;}
function startSubs(){
  S.got=S.got||{};S.mode='loading';render();
  clearTimeout(S.slowT);S.slowT=setTimeout(()=>{if(S.mode==='loading'){S.mode='ready';S.slow=true;setStatus('서버 응답 지연','err');render();}},10000);
  subscribe('trips');subscribe('plans');
  if(S.editor)subscribe('people');else{unsubscribe('people');S.people={};}
}
async function initFirebase(){
  if(!FIREBASE_CONFIG)throw new Error('Firebase 설정값이 아직 입력되지 않았습니다');
  if(!window.firebase||!window.firebase.firestore){const b='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-auth-compat.js');await loadScript(b+'firebase-firestore-compat.js');}
  if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  Store.db=fbAdapter(firebase.firestore());S.store='fb';S.editor=false;
  setStatus('Firebase 연결 중');
  let first=true;
  firebase.auth().onAuthStateChanged(u=>{
    S.fbUser=u||null;S.editor=!!u;if(!u)S.viewOnly=false;
    applyHash();
    if(first){first=false;startSubs();}
    else{if(S.editor)subscribe('people');else{unsubscribe('people');S.people={};if(S.view==='people')S.view='trips';}render();}
  });
}
async function init(){
  render();
  window.addEventListener('hashchange',()=>{applyHash();render();window.scrollTo(0,0);});
  if(useFirebase()){

    catch(e){console.error(e);toast('Firebase 연결 실패: '+((e&&e.message)||e)+' · 이 기기에만 저장합니다',true);}
  }
  const use=n=>{try{return(window.claude&&typeof window.claude.use==='function')?Promise.race([window.claude.use(n),sleep(10000).then(()=>null)]).catch(()=>null):Promise.resolve(null);}catch(e){return Promise.resolve(null);}};
  const [db,dl,usr]=await Promise.all([use('db'),use('downloads'),use('user')]);
  downloads=dl;
  if(db){
    let owner=null;if(usr){try{owner=await usr.isOwner();}catch(e){owner=null;}}
    Store.db=db;S.store='db';S.editor=owner!==false;
    applyHash();setStatus('서버 연결 중');startSubs();
  }else{
    Store.local=true;S.store='local';S.editor=true;applyHash();
    try{const d=JSON.parse(localStorage.getItem(LKEY)||'null');if(d){S.people=d.people||{};S.trips=d.trips||{};S.plans=d.plans||{};}}catch(e){}
    S.mode='ready';setStatus('이 기기에만 저장','local');render();
  }
}

function parseHash(){const m=String(location.hash||'').match(/^#(view|plan)-([A-Za-z0-9-]+)$/);return m?{kind:m[1]==='plan'?'plan':'trip',id:m[2]}:null;}
function applyHash(){

}
function qrMatrix(text){const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();const n=q.getModuleCount();
  return{n,dark:(r,c)=>q.isDark(r,c)};}
function qrSVG(text){
  const {n,dark}=qrMatrix(text),m=4;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(dark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="조회 전용 QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}
function qrPNG(text,title,sub){
  const {n,dark}=qrMatrix(text),m=4,sc=12,W=(n+2*m)*sc,H=W+(title?92:0);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#111';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(dark(r,c))g.fillRect((c+m)*sc,(r+m)*sc,sc,sc);
  if(title){g.textAlign='center';g.font='bold 26px "Noto Sans KR",sans-serif';g.fillText(title.slice(0,24),W/2,W+30);
    g.font='18px "Noto Sans KR",sans-serif';g.fillStyle='#555';g.fillText(sub||'',W/2,W+62);}
  return new Promise(res=>cv.toBlob(res,'image/png'));
}
function qrSection(t,kind){
  const isPlan=kind==='plan';const url=isPlan?planUrl(t.id):viewUrl(t.id);
  return `<section class="card qr-card"><h4 class="sec" style="margin-top:0">조회 전용 QR <small>읽기만 가능 · 수정 불가</small></h4>
    <div class="qr-wrap"><div class="qr">${qrSVG(url)}</div>
    <div class="qr-info"><p class="small" style="margin-top:0">휴대폰 카메라로 찍으면 <b>${esc(t.name)}</b>의 ${isPlan?'예상 경비·비용 요약·일정':'지출 내역·정산'}을 조회 전용으로 엽니다. 수정·삭제·입력 버튼이 없고, 저장 권한도 소유자에게만 있습니다. 연락처·이메일 같은 인원 정보는 보이지 않습니다.</p>
      <div class="qr-url">${esc(url)}</div>
      <div class="btns"><button class="btn sm" data-act="copyLink" data-id="${t.id}" data-kind="${isPlan?'plan':'trip'}">링크 복사</button><button class="btn sm" data-act="saveQR" data-id="${t.id}" data-kind="${isPlan?'plan':'trip'}">QR 이미지 저장</button><button class="btn sm" data-act="previewView" data-id="${t.id}" data-kind="${isPlan?'plan':'trip'}">조회 화면 미리보기</button></div>
      <p class="muted small" style="margin-bottom:0">QR을 받은 사람은 claude.ai에 로그인해야 하고, 이 페이지를 공유(보기 권한)받아야 열 수 있습니다. 공유는 페이지 오른쪽 위 ‘공유’에서 설정하세요.</p></div></div></section>`;
}
function qrModal(t,kind){
  openModal('조회 전용 QR',qrSection(t,kind).replace('<section class="card qr-card">','<section>'),'',()=>{});

/* ---------- calc ---------- */
const cur=()=>S.trips[S.tripId];
const gOrd=g=>{if(!g)return 99;const i=['회사','가족','친구','지인','거래처','기타'].indexOf(g);return i<0?50:i;};
const sortedPeople=()=>Object.values(S.people).sort((a,b)=>gOrd(a.group)-gOrd(b.group)||(a.group||'').localeCompare(b.group||'','ko')||(a.team||'').localeCompare(b.team||'','ko')||(a.name||'').localeCompare(b.name||'','ko'));
function memberName(t,id){const p=S.people[id];if(p)return p.name;const m=(t.members||[]).find(m=>m.id===id);return m?m.name:'(삭제된 인원)';}
function memberTeam(t,id){const p=S.people[id];if(p)return p.team||'';const m=(t.members||[]).find(m=>m.id===id);return m?(m.team||''):'';}
function expKRW(e){if(!e.currency||e.currency==='KRW')return pnum(e.amount);return pnum(e.amount)*pnum(e.rate)/(pnum(e.unit)||1);}
const sortedExp=t=>[...(t.expenses||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0));
function calc(t){
  const ids=t.memberIds||[]; const per={}; ids.forEach(id=>per[id]={share:0,paid:0});
  let total=0,unpaid=0; const byCur={};
  (t.expenses||[]).forEach(e=>{
    const k=expKRW(e); total+=k;
    const c=e.currency||'KRW'; byCur[c]=(byCur[c]||0)+pnum(e.amount);
    const tg=(e.targets||[]).filter(id=>per[id]); tg.forEach(id=>per[id].share+=k/tg.length);
    const py=(e.payers||[]).filter(id=>per[id]); py.forEach(id=>per[id].paid+=k/py.length);
    if(!py.length)unpaid+=k;
  });
  Object.values(per).forEach(v=>v.net=v.share-v.paid);
  return{total,avg:ids.length?total/ids.length:0,per,unpaid,byCur};
}
function transfers(c,ids){
  const deb=[],cre=[];
  ids.forEach(id=>{const n=Math.round(c.per[id]?.net||0);if(n>0)deb.push({id,a:n});else if(n<0)cre.push({id,a:-n});});
  deb.sort((a,b)=>b.a-a.a);cre.sort((a,b)=>b.a-a.a);
  const out=[];let i=0,j=0;
  while(i<deb.length&&j<cre.length){const x=Math.min(deb[i].a,cre[j].a);if(x>0)out.push({from:deb[i].id,to:cre[j].id,a:x});deb[i].a-=x;cre[j].a-=x;if(deb[i].a<=0)i++;if(cre[j].a<=0)j++;}
  return out;
}
function dateRange(t){if(!t.startDate)return'';if(!t.endDate||t.endDate===t.startDate)return `${t.startDate} (당일)`;
  const d=Math.round((new Date(t.endDate)-new Date(t.startDate))/864e5)+1;return `${t.startDate} ~ ${t.endDate}${d>0?` (${d}일)`:''}`;}

    return `<div class="tl-sec"><div class="tl-h"><b>${title}</b><span class="muted small">${arr.length}건 · ${won(sum)}원${extra||''}</span></div><div class="cards plan-grid">${arr.map(tripCard).join('')}</div></div>`;};
  let body='';
  if(!all.length)body=`<div class="empty">등록된 여정이 없습니다.<br><b>+ 여정 등록</b>으로 시작하세요.</div>`;
  else if(!list.length)body=`<div class="empty">조건에 맞는 여정이 없습니다.</div>`;
  else if(S.tlGroup==='all'){
    body=`<div class="cards plan-grid">${list.map(tripCard).join('')}</div>`;
  }else if(S.tlGroup==='scope'){
    body=['intl','dom'].map(k=>{const arr=list.filter(t=>planScope(t)===k);return arr.length?sec(k==='intl'?'<span class="stag intl">해외</span> 해외 여정':'<span class="stag dom">국내</span> 국내 여정',arr):'';}).join('');
  }else{
    const groups=[];list.forEach(t=>{const k=(t.startDate||'').slice(0,7)||'날짜 없음';let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,arr:[]});g.arr.push(t);});
    body=groups.map(g=>{const [y,m]=g.k.split('-');const ni=g.arr.filter(t=>planScope(t)==='intl').length;
      return sec(m?`${y}년 ${+m}월`:g.k,g.arr,` · 해외 ${ni} · 국내 ${g.arr.length-ni}`);}).join('');
  }
  const bar=all.length?`<div class="tl-bar">
    <div class="seg tl-seg"><button type="button" data-act="tlGroup" data-v="all" class="${S.tlGroup==='all'?'on':''}">전체</button><button type="button" data-act="tlGroup" data-v="date" class="${S.tlGroup==='date'?'on':''}">날짜순</button><button type="button" data-act="tlGroup" data-v="scope" class="${S.tlGroup==='scope'?'on':''}">해외/국내별</button></div>
    <button type="button" class="btn sm" data-act="tlSort">${S.tlSort==='asc'?'오래된순 ↑':'최신순 ↓'}</button>
    <div class="catbar tl-filter"><button type="button" data-act="tlFilter" data-v="all" class="${S.tlFilter==='all'?'on':''}">모두 ${all.length}</button><button type="button" data-act="tlFilter" data-v="intl" class="${S.tlFilter==='intl'?'on':''}">해외 ${nI}</button><button type="button" data-act="tlFilter" data-v="dom" class="${S.tlFilter==='dom'?'on':''}">국내 ${nD}</button></div></div>`:'';
  return `<section class="head-row"><h2>출장/여행 관리</h2>${S.ro?'':`<div class="btns">
    <button class="btn" data-act="importTrip">스프레드시트 가져오기</button>
    <button class="btn" data-act="copyTripFrom">기존 여정 복사</button>
    <button class="btn primary" data-act="newTrip">+ 여정 등록</button></div>`}</section>
  ${bar}${body}`;
}
function tripCard(t){const c=calc(t);return `<article class="card trip-card">
  <div class="tc-main" data-act="openTrip" data-id="${t.id}">
    <div class="tc-title">${scopeTag(t)}${tripStatus(t)} ${esc(t.name||'(제목 없음)')}</div>
    <div class="tc-meta">${esc(dateRange(t))}${placeOf(t)?' · '+esc(placeOf(t)):''}</div>
    <div class="tc-purpose">${esc(bizLine(t))}</div>
    <div class="tc-stats"><span>출장자 ${(t.memberIds||[]).length}명</span><span>지출 ${(t.expenses||[]).length}건</span><b>${won(c.total)}원</b></div>
  </div>
  <div class="tc-actions"><button class="btn sm" data-act="openTrip" data-id="${t.id}">열기</button>${S.ro?'':`<button class="btn sm" data-act="editTrip" data-id="${t.id}">수정</button>`}<button class="btn sm" data-act="qrTrip" data-id="${t.id}">QR</button>${S.ro?'':`<button class="btn sm" data-act="dupTrip" data-id="${t.id}">복사</button><button class="btn sm danger" data-act="delTrip" data-id="${t.id}">삭제</button>`}</div>
</article>`;}

function viewTrip(t){
  const c=calc(t); const n=(t.memberIds||[]).length;
  const curs=Object.entries(c.byCur).map(([k,v])=>`${k} ${num(v)}`).join(' · ');
  const tabs=[['expenses','지출 내역'],['settle','정산'],['members','출장자'],['rates','환율']];
  let body='';
  if(S.tripTab==='settle')body=viewSettle(t,c);
  else if(S.tripTab==='members')body=viewMembers(t,c);
  else if(S.tripTab==='rates')body=viewRates(t);
  else body=viewExpenses(t);
  const ro=S.ro;
  return `${ro?`<div class="ro-bar">🔒 조회 전용 화면 · 내용을 수정할 수 없습니다 ${S.viewId?`<button class="btn sm" data-act="exitView">${isEditor()?'편집 화면으로':'← 여정 목록'}</button>`:'<button class="btn sm" data-act="back">← 여정 목록</button>'}</div>`:`<div class="crumb"><button class="btn link" data-act="back">← 출장 목록</button></div>`}
  <section class="card trip-head"><div class="th-info"><h3>${scopeTag(t)} ${esc(t.name)}</h3>
    <div class="meta">${esc(dateRange(t))}${placeOf(t)?' · '+esc(placeOf(t)):''}</div>
    ${bizLine(t)?`<div class="meta">${esc(bizLine(t))}</div>`:''}${t.memo?`<div class="meta clamp">${esc(t.memo)}</div>`:''}
    <div class="btns th-btns">${ro?`<button class="btn sm" data-act="exportTrip">스프레드시트</button><button class="btn sm" data-act="pdfTrip">PDF</button>`:`<button class="btn sm" data-act="editTrip" data-id="${t.id}">수정</button><button class="btn sm" data-act="exportTrip">스프레드시트</button><button class="btn sm" data-act="pdfTrip">PDF</button><button class="btn sm danger" data-act="delTrip" data-id="${t.id}">삭제</button>`}</div></div>
    ${ro?'':`<button class="th-qr" data-act="qrTrip" data-id="${t.id}" title="조회 전용 QR 크게 보기">${qrSVG(viewUrl(t.id))}<span>조회 QR</span></button>`}</section>
  <section class="dash">
    <div class="total"><div class="k">출장 총 비용</div><div class="v">${won(c.total)}<small>원</small></div></div>
    <div><div class="k">1인 평균</div><div class="v">${won(c.avg)}<small>원</small></div></div>
    <div><div class="k">지출 건수</div><div class="v">${(t.expenses||[]).length}<small>건</small></div></div>
    <div><div class="k">출장자</div><div class="v">${n}<small>명</small></div></div>
    ${curs?`<div class="dash-sub">통화별 합계: ${esc(curs)}${c.unpaid>0?` · <span class="plus">결제자 미지정 ${won(c.unpaid)}원</span>`:''}</div>`:''}
  </section>
  <div class="subtabs">${tabs.map(([k,l])=>`<button data-act="tab" data-tab="${k}" class="${S.tripTab===k?'on':''}">${l}</button>`).join('')}</div>
  ${body}
  ${ro?'':'<button class="fab" data-act="newExp">+ 지출 입력</button>'}`;
}

function viewExpenses(t){
  if(!(t.memberIds||[]).length)return S.ro?'<div class="empty">지정된 출장자가 없습니다.</div>':`<div class="empty">먼저 출장자를 지정하세요.<br><br><button class="btn primary" data-act="pickMembers">출장자 지정</button></div>`;
  const ex=sortedExp(t);
  if(!ex.length)return S.ro?'<div class="empty">아직 지출 내역이 없습니다.</div>':`<div class="empty">아직 지출 내역이 없습니다.<br>오른쪽 아래 <b>+ 지출 입력</b>을 누르세요.</div>`;
  const groups={}; ex.forEach(e=>(groups[e.date||'날짜 없음']||=[]).push(e));
  return Object.entries(groups).map(([d,list])=>{
    const sub=list.reduce((s,e)=>s+expKRW(e),0);
    return `<div class="day"><span>${esc(d)} ${wd(d)?'('+wd(d)+')':''}</span><span>소계 ${won(sub)}원</span></div><div class="exp-grid">${list.map(e=>expCard(t,e)).join('')}</div>`;
  }).join('');
}
function expCard(t,e){
  const k=expKRW(e), tg=(e.targets||[]), py=(e.payers||[]);
  const fx=e.currency&&e.currency!=='KRW'?`${num(e.amount)} ${esc(e.currency)} × ${fmtRate(e.rate)}원${pnum(e.unit)>1?' / '+num(e.unit,0):''}`:'원화 결제';
  const all=tg.length&&tg.length===(t.memberIds||[]).length&&(t.memberIds||[]).length>1;
  const tgTxt=!tg.length?'<span class="warn-t">대상 없음</span>':all?`전체 ${tg.length}명`:esc(tg.map(id=>memberName(t,id)).join(', '));
  const pyTxt=py.length?`<span class="pay-t">${esc(py.map(id=>memberName(t,id)).join(', '))}</span>`:'<span class="warn-t">미지정</span>';
  return `<div class="exp"><div class="exp-item" title="${esc(e.item)}">${esc(e.item)}</div>
    <div class="exp-amt">${won(k)}<small>원</small></div>
    <div class="exp-fx">${fx}</div>
    ${e.memo?`<div class="exp-memo" title="${esc(e.memo)}">${esc(e.memo)}</div>`:''}
    <div class="exp-row"><span class="lbl">대상</span><span class="v">${tgTxt}${tg.length?` <span class="muted">· 1인 ${won(k/tg.length)}</span>`:''}</span></div>
    <div class="exp-row"><span class="lbl">결제</span><span class="v">${pyTxt}</span></div>
    ${S.ro?'':`<div class="exp-act"><button class="btn sm" data-act="editExp" data-id="${e.id}">수정</button><button class="btn sm danger" data-act="delExp" data-id="${e.id}">삭제</button></div>`}</div>`;
}

function viewSettle(t,c){
  const ids=t.memberIds||[];
  if(!ids.length)return `<div class="empty">출장자가 없습니다.</div>`;
  let ts=0,tp=0,tn=0;
  const rows=ids.map(id=>{const v=c.per[id];ts+=v.share;tp+=v.paid;tn+=v.net;
    return `<tr><td class="l"><b>${esc(memberName(t,id))}</b></td><td class="l muted">${esc(memberTeam(t,id))}</td><td class="plus">+${won(v.share)}</td><td class="minus">${v.paid?'−'+won(v.paid):'0'}</td><td class="net ${v.net>0.5?'plus':v.net<-0.5?'minus':''}">${v.net>0.5?'+':v.net<-0.5?'−':''}${won(Math.abs(v.net))}</td></tr>`;}).join('');
  const xs=transfers(c,ids);
  const ex=sortedExp(t);
  const matrix=ex.length?`<h4 class="sec">항목별 분담표 <small>+ 부담 / − 결제</small></h4><div class="table-wrap"><table>
    <thead><tr><th class="l">일자</th><th class="l">항목</th><th>원화금액</th>${ids.map(id=>`<th>${esc(memberName(t,id))}</th>`).join('')}</tr></thead>
    <tbody>${ex.map(e=>{const k=expKRW(e),tg=e.targets||[],py=e.payers||[];
      return `<tr><td class="l muted">${esc((e.date||'').slice(5))}</td><td class="l">${esc(e.item)}</td><td>${won(k)}</td>${ids.map(id=>{const s=tg.includes(id)?k/tg.length:0,p=py.includes(id)?k/py.length:0;
        return `<td>${s?`<span class="plus">+${won(s)}</span>`:''}${s&&p?'<br>':''}${p?`<span class="minus">−${won(p)}</span>`:''}${!s&&!p?'<span class="muted">-</span>':''}</td>`;}).join('')}</tr>`;}).join('')}</tbody>
    <tfoot><tr><td class="l" colspan="2">정산 합계</td><td>${won(c.total)}</td>${ids.map(id=>{const v=c.per[id].net;return `<td class="${v>0.5?'plus':v<-0.5?'minus':''}">${v>0.5?'+':v<-0.5?'−':''}${won(Math.abs(v))}</td>`;}).join('')}</tr></tfoot></table></div>`:'';
  return `<div class="table-wrap"><table><thead><tr><th class="l">출장자</th><th class="l">팀</th><th>부담액 (+)</th><th>결제액 (−)</th><th>정산 합계</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td class="l" colspan="2">합계</td><td class="plus">+${won(ts)}</td><td class="minus">−${won(tp)}</td><td>${won(tn)}</td></tr></tfoot></table></div>
    <p class="legend">정산 합계가 <span class="plus">+</span>이면 더 내야 할 금액, <span class="minus">−</span>이면 돌려받을 금액입니다. 부담액은 각 지출을 지정된 대상 인원 수로 나눈 값입니다.${c.unpaid>0?` 결제자가 지정되지 않은 ${won(c.unpaid)}원은 결제액에 반영되지 않았습니다.`:''}</p>
    ${accountsHTML(t)}
    <h4 class="sec">송금 안내</h4>
    <div class="list">${xs.length?xs.map(x=>{const a=acctOf(t,x.to);return `<div class="xfer"><span>${esc(memberName(t,x.from))}</span><span class="muted">→</span><span>${esc(memberName(t,x.to))}</span><b>${won(x.a)}원</b></div>${a?`<div class="xfer-acct"><span>${esc(a.bank)} ${esc(a.number)}${a.holder?' · '+esc(a.holder):''}</span><button class="btn sm" data-act="copyAcct" data-id="${a.id}">계좌 복사</button></div>`:''}`;}).join(''):'<div class="xfer muted">주고받을 금액이 없습니다.</div>'}</div>
    ${matrix}
    <div class="btns" style="margin-top:12px"><button class="btn sm" data-act="copySettle">정산표 복사</button><button class="btn sm" data-act="exportTrip">스프레드시트 내보내기</button><button class="btn sm" data-act="pdfTrip">PDF 저장</button></div>`;
}

function viewMembers(t,c){
  const ids=t.memberIds||[];
  if(S.ro)return ids.length?`<div class="list">${ids.map(id=>{const v=c.per[id]||{net:0};return `<div class="person"><div class="pi"><div class="pn">${esc(memberName(t,id))} <span class="muted small">${esc(memberTeam(t,id))}</span></div></div>
    <div class="net small ${v.net>0.5?'plus':v.net<-0.5?'minus':''}">${v.net>0.5?'+':v.net<-0.5?'−':''}${won(Math.abs(v.net))}원</div></div>`;}).join('')}</div>`:'<div class="empty">지정된 출장자가 없습니다.</div>';
  return `<div class="head-row"><span class="muted small">출장자 정보 수정은 이 화면이나 ‘인원 정보’에서 할 수 있습니다.</span><button class="btn sm primary" data-act="pickMembers">출장자 선택/추가</button></div>
  ${ids.length?`<div class="list">${ids.map(id=>{const p=S.people[id]||{};const v=c.per[id]||{net:0};return `<div class="person"><div class="pi"><div class="pn">${p.group?`<span class="gtag ${gcls(p.group)}">${esc(p.group)}</span> `:''}${esc(memberName(t,id))} <span class="muted small">${esc(memberTeam(t,id))}</span></div>
    <div class="pd">${esc([p.phone,p.email].filter(Boolean).join(' · ')||(S.people[id]?'':'인원 정보에서 삭제됨'))}</div></div>
    <div class="net small ${v.net>0.5?'plus':v.net<-0.5?'minus':''}">${v.net>0.5?'+':v.net<-0.5?'−':''}${won(Math.abs(v.net))}원</div>
    ${S.people[id]?`<button class="btn sm" data-act="editPerson" data-id="${id}">수정</button>`:''}<button class="btn sm danger" data-act="removeMember" data-id="${id}">제외</button></div>`;}).join('')}</div>`:'<div class="empty">지정된 출장자가 없습니다.</div>'}`;
}

function ratesHTML(rates,editable){

  return rates.map((r,i)=>`<div class="rate-row"><div class="rc"><b>${esc(r.code)}</b><small>${esc(r.name||'')}</small></div>
    <div class="rv"><div class="big">${fmtRate(r.rate)} 원</div><div class="unit">(${num(r.unit,0)} ${esc(r.code)}당)</div></div>

}
function viewRates(t){

  return `<div class="head-row"><span class="muted small">지출 입력 시 통화를 고르면 이 마스터 환율이 결제환율로 자동 입력됩니다.</span><button class="btn sm primary" data-act="addRate">+ 환율 추가</button></div>
  <div id="trip-rates">${ratesHTML(t.rates||[],true)}</div>`;

function viewPeople(){
  return `<section class="head-row"><h2>인원 정보</h2><div class="btns">
    <button class="btn" data-act="peopleImport">텍스트·스프레드시트 입력</button>
    <button class="btn" data-act="peopleExport">내보내기</button>
    <button class="btn primary" data-act="newPerson">+ 인원 추가</button></div></section>
    <input class="search" id="pq" placeholder="이름·구분·팀·연락처 검색" value="${esc(S.pq)}">
    <div id="plist">${peopleListHTML()}</div>`;
}
function peopleListHTML(){
  const kw=S.pq.trim().toLowerCase();
  const all=sortedPeople();
  const cats=groupsInUse(); if(S.pcat&&!cats.includes(S.pcat))S.pcat='';
  const ps=all.filter(p=>(!S.pcat||(S.pcat==='__none'?!p.group:p.group===S.pcat))&&(!kw||[p.name,p.group,p.team,p.phone,p.email,p.memo].join(' ').toLowerCase().includes(kw)));
  if(!all.length)return '<div class="empty">등록된 인원이 없습니다.<br>직접 추가하거나 텍스트·스프레드시트로 입력하세요.</div>';
  const used=id=>Object.values(S.trips).filter(t=>(t.memberIds||[]).includes(id)).length;
  const cnt=g=>all.filter(p=>g==='__none'?!p.group:p.group===g).length;
  const hasNone=all.some(p=>!p.group);
  const filt=`<div class="catbar"><button type="button" data-pcat="" class="${!S.pcat?'on':''}">전체 ${all.length}</button>${cats.map(g=>`<button type="button" data-pcat="${esc(g)}" class="${S.pcat===g?'on':''}">${esc(g)} ${cnt(g)}</button>`).join('')}${hasNone&&cats.length?`<button type="button" data-pcat="__none" class="${S.pcat==='__none'?'on':''}">미지정 ${cnt('__none')}</button>`:''}</div>`;
  return `${filt}<div class="muted small" style="margin:0 2px 6px">${S.pcat||kw?`표시 ${ps.length}명 / `:''}총 ${all.length}명</div>${ps.length?`<div class="pgrid">${ps.map(p=>`<div class="pcard">
    <div class="pc-top">${p.group?`<span class="gtag ${gcls(p.group)}">${esc(p.group)}</span>`:''}${used(p.id)?`<span class="pc-used" title="참여한 여정 수">여정 ${used(p.id)}</span>`:''}</div>
    <div class="pc-name" title="${esc(p.name)}">${esc(p.name)}</div>
    <div class="pc-team" title="${esc(p.team||'')}">${esc(p.team||'-')}</div>
    ${p.phone?`<div class="pc-line" title="${esc(p.phone)}">📞 ${esc(p.phone)}</div>`:''}
    ${p.email?`<div class="pc-line" title="${esc(p.email)}">✉️ ${esc(p.email)}</div>`:''}
    ${p.acct?`<div class="pc-line" title="${esc((p.bank||'')+' '+p.acct+(p.holder?' ('+p.holder+')':''))}">🏦 ${esc(p.bank||'')} ${esc(p.acct)}</div>`:''}
    ${p.memo?`<div class="pc-line muted" title="${esc(p.memo)}">${esc(p.memo)}</div>`:''}
    <div class="pc-act"><button class="btn sm" data-act="editPerson" data-id="${p.id}">수정</button><button class="btn sm danger" data-act="delPerson" data-id="${p.id}">삭제</button></div></div>`).join('')}</div>`:'<div class="empty">조건에 맞는 인원이 없습니다.</div>'}`;
}
const GROUPS=['회사','가족','친구','지인','거래처','기타'];
const gcls=g=>({'회사':'g-co','가족':'g-fa','친구':'g-fr','지인':'g-ac','거래처':'g-cl'}[g]||'g-et');
function groupsInUse(){const s=new Set(Object.values(S.people).map(p=>p.group).filter(Boolean));return [...GROUPS.filter(g=>s.has(g)),...[...s].filter(g=>!GROUPS.includes(g)).sort()];}

/* ---------- modal ---------- */
const stack=[];
function openModal(title,body,foot,mount){
  const el=document.createElement('div');el.className='overlay';
  el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h3>${esc(title)}</h3><button class="x" data-close aria-label="닫기">✕</button></div><div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot">${foot}</div>`:''}</div>`;
  $('#modal-root').appendChild(el);stack.push(el);
  el.addEventListener('click',ev=>{if(ev.target.closest('[data-close]'))closeModal(el);});
  if(mount)mount(el);
  const f=el.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea');if(f&&matchMedia('(min-width:641px)').matches)setTimeout(()=>f.focus(),30);
  return el;
}
function closeModal(el){el=el||stack[stack.length-1];if(!el)return;el.remove();const i=stack.indexOf(el);if(i>=0)stack.splice(i,1);}
function askConfirm(msg,yes,label='삭제'){
  openModal('확인',`<p style="margin:0;white-space:pre-line">${esc(msg)}</p>`,`<button class="btn" data-close>취소</button><button class="btn primary" data-yes style="background:var(--danger);border-color:var(--danger)">${esc(label)}</button>`,el=>{
    el.querySelector('[data-yes]').onclick=()=>{closeModal(el);yes();};});
}

      (ps.length?ps.map(p=>`<label class="chk"><input type="checkbox" value="${p.id}" ${sel.has(p.id)?'checked':''}><span>${esc(p.name)}</span><small>${esc([p.group,p.team].filter(Boolean).join(' · '))}</small></label>`).join(''):'<div class="muted small">조건에 맞는 인원이 없습니다. 아래에서 바로 추가하세요.</div>');

function cleanupRemoved(t,removed){
  if(!removed.length)return;
  (t.accounts||[]).forEach(a=>{if(removed.includes(a.memberId)){a.label=a.label||memberName(t,a.memberId);a.memberId='';}});
  (t.expenses||[]).forEach(e=>{e.targets=(e.targets||[]).filter(id=>!removed.includes(id));e.payers=(e.payers||[]).filter(id=>!removed.includes(id));});
}
function usedIn(t,ids){return (t.expenses||[]).filter(e=>ids.some(id=>(e.targets||[]).includes(id)||(e.payers||[]).includes(id))).length;}

/* ---------- 여정 텍스트 입력 ---------- */
const COUNTRIES=['대한민국','한국','베트남','일본','중국','대만','홍콩','마카오','태국','싱가포르','필리핀','인도네시아','말레이시아','인도','캄보디아','라오스','미얀마','몽골','미국','캐나다','멕시코','브라질','영국','프랑스','독일','이탈리아','스페인','포르투갈','네덜란드','벨기에','스위스','오스트리아','체코','폴란드','헝가리','튀르키예','터키','아랍에미리트','UAE','사우디아라비아','카타르','이집트','호주','뉴질랜드','괌','사이판','러시아','우즈베키스탄','카자흐스탄'];
function splitPlace(str){ // '하노이, 베트남' / '베트남 하노이' → {city, country}
  const toks=String(str||'').split(/[,，\/·]+|\s+/).map(x=>x.trim()).filter(Boolean);
  let country='';const rest=[];toks.forEach(t=>{if(!country&&COUNTRIES.includes(t))country=t;else rest.push(t);});
  return{city:rest.join(' '),country};
}
const KOREA=['대한민국','한국','Korea','KR'];
// 해외/국내: 저장값 → 국가 → (국가 없으면) 환율 등록 여부로 판단
const planScope=p=>p.scope||(KOREA.includes(p.country)?'dom':p.country?'intl':((p.rates||[]).length?'intl':'dom'));
const scopeTag=p=>planScope(p)==='dom'?'<span class="stag dom">국내</span>':'<span class="stag intl">해외</span>';
const bizLine=t=>[t.company,t.purpose].filter(Boolean).join(' · ');
const placeOf=t=>{const c=t.city||'',k=(['대한민국','한국'].includes(t.country)||(t.city&&t.city===t.country))?'':(t.country||'');if(c||k)return [c,k].filter(Boolean).join(', ');return t.location||'';};
const TRIP_KEYS={scope:['구분','지역구분'],name:['여정명','출장명','여행명','제목'],period:['기간','일정','날짜','일자'],company:['업체명','업체','회사','방문처','거래처'],location:['장소','지역','목적지'],city:['도시'],country:['국가','나라'],purpose:['목적','용무'],members:['출장자','인원','참여자','동행','멤버','일행'],rates:['환율','마스터환율','마스터 환율'],memo:['메모','비고']};
function parseTripDates(str,yr){
  const D='(\\d{4}[-./]\\d{1,2}[-./]\\d{1,2}|\\d{1,2}[./]\\d{1,2}|\\d{1,2}월\\s*\\d{1,2}일?)';
  const nd=s=>{s=String(s).replace(/\s/g,'');let m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);if(m)return{y:+m[1],m:+m[2],d:+m[3]};
    m=s.match(/^(\d{1,2})[./](\d{1,2})$/)||s.match(/^(\d{1,2})월(\d{1,2})일?$/);if(m)return{y:null,m:+m[1],d:+m[2]};return null;};
  const fmt=o=>`${o.y}-${String(o.m).padStart(2,'0')}-${String(o.d).padStart(2,'0')}`;
  const ok=o=>o&&o.m>=1&&o.m<=12&&o.d>=1&&o.d<=31;
  let re=new RegExp(D+'\\s*(?:~|〜|∼|–|—|-|부터)\\s*(?:'+D+'|(\\d{1,2})일?)(?:까지)?');
  let m=str.match(re);
  if(m){const a=nd(m[1]);let b=m[2]?nd(m[2]):(m[3]?{y:null,m:a&&a.m,d:+m[3]}:null);
    const guessY=o=>{const t0=today();const c=`${yr}-${String(o.m).padStart(2,'0')}-${String(o.d).padStart(2,'0')}`;return (new Date(t0)-new Date(c))/864e5>60?yr+1:yr;};
    if(ok(a)&&ok(b)){a.y=a.y||guessY(a);b.y=b.y||a.y;if(fmt(b)<fmt(a)&&!/^\d{4}/.test(m[2]||''))b.y++;return{start:fmt(a),end:fmt(b),rest:str.replace(m[0],' ')};}}
  m=str.match(new RegExp(D));
  if(m){const a=nd(m[1]);if(ok(a)){a.y=a.y||((new Date(today())-new Date(`${yr}-${String(a.m).padStart(2,'0')}-${String(a.d).padStart(2,'0')}`))/864e5>60?yr+1:yr);return{start:fmt(a),end:fmt(a),rest:str.replace(m[0],' ')};}}
  return{start:'',end:'',rest:str};
}
function parseRatesText(v){
  const out=[],errs=[];
  String(v||'').split(/[;；\n]|[,，](?!\d{3}(?!\d))/).map(x=>x.trim()).filter(Boolean).forEach(it=>{
    let m=it.match(/^(\d+)\s*([A-Za-z]{3}|엔|동|루피아)\s*(?:당)?\s*[:=]?\s*([\d,.]+)\s*원?$/);
    let code,unit=null,rate;
    if(m){code=CUR_WORDS[m[2]]||m[2].toUpperCase();unit=+m[1];rate=pnum(m[3]);}
    else{m=it.match(/^([A-Za-z]{3}|[$€¥£]|엔|엔화|달러|위안|동|바트|유로|페소|파운드)\s*[:=]?\s*([\d,.]+)\s*원?(?:\s*[\/(]\s*(\d+)\s*\)?)?$/);
      if(m){code=CUR_WORDS[m[1]]||m[1].toUpperCase();rate=pnum(m[2]);if(m[3])unit=+m[3];}}
    if(!m||!(rate>0)){errs.push(`환율 ‘${it}’ 인식 불가`);return;}
    if(code==='KRW')return;
    const p=PRESETS.find(x=>x.code===code);
    let u=unit||(p?p.unit:1);
    if(!unit&&u===100&&((code==='JPY'&&rate<100)||((code==='VND'||code==='IDR')&&rate<1)))u=1; // '엔 9.1' = 1엔당
    out.push({code,name:p?p.name:code,unit:u,rate});
  });
  return{rates:out,errs};
}
function parseTripText(text){
  const yr=+today().slice(0,4);
  const blocks=String(text||'').replace(/\r\n?/g,'\n').split(/\n\s*(?:-{3,}\s*)?\n|\n-{3,}\n/).map(b=>b.trim()).filter(Boolean);
  const all=Object.entries(TRIP_KEYS).flatMap(([k,ws])=>ws.map(w=>[w,k])).sort((a,b)=>b[0].length-a[0].length);
  const keyRe=new RegExp('('+all.map(x=>x[0].replace(/\s/g,'\\s*')).join('|')+')\\s*[:：=]','g');
  return blocks.map(block=>{
    const t={name:'',startDate:'',endDate:'',company:'',location:'',city:'',country:'',purpose:'',memo:'',members:[],rates:[],errs:[]};
    const vals={};const free=[];
    block.split('\n').forEach(line=>{
      const hits=[...line.matchAll(keyRe)];
      if(!hits.length){free.push(line.trim());return;}
      if(hits[0].index>0)free.push(line.slice(0,hits[0].index).trim());
      hits.forEach((h,i)=>{const key=all.find(x=>new RegExp('^'+x[0].replace(/\s/g,'\\s*')+'$').test(h[1]))[1];
        const end=i+1<hits.length?hits[i+1].index:line.length;
        const v=line.slice(h.index+h[0].length,end).trim().replace(/[,，]\s*$/,'');
        vals[key]=vals[key]?vals[key]+', '+v:v;});
    });
    let freeTxt=free.filter(Boolean).map(x=>x.replace(/(^|\s)(국내|해외)(?=\s|$)/,(m,a,w)=>{t.scope=w==='국내'?'dom':'intl';return a;}).trim()).filter(Boolean);
    if(vals.scope)t.scope=/국내/.test(vals.scope)?'dom':'intl';
    let dt=vals.period?parseTripDates(vals.period,yr):{start:'',end:''};
    if(!dt.start&&freeTxt.length){for(let i=0;i<freeTxt.length;i++){const r=parseTripDates(freeTxt[i],yr);if(r.start){dt=r;freeTxt[i]=r.rest.replace(/\s+/g,' ').trim();break;}}}
    if(vals.period&&!dt.start)t.errs.push(`기간 ‘${vals.period}’ 인식 불가`);
    t.startDate=dt.start;t.endDate=dt.end;
    freeTxt=freeTxt.filter(Boolean);
    t.name=(vals.name||freeTxt.shift()||'').trim();
    t.company=vals.company||'';t.purpose=vals.purpose||'';
    if(vals.location){const sp=splitPlace(vals.location);t.city=sp.city;t.country=sp.country;}
    if(vals.city)t.city=vals.city.trim();if(vals.country)t.country=vals.country.trim();
    if(!t.country&&t.city&&COUNTRIES.includes(t.city)){t.country=t.city;t.city='';}
    if(!t.scope)t.scope=KOREA.includes(t.country)?'dom':(t.country||t.rates.length)?'intl':'';
    if(t.scope==='dom'&&!t.country)t.country='대한민국';
    t.location=[t.city,t.country].filter(Boolean).join(', ');
    t.memo=[vals.memo,...freeTxt].filter(Boolean).join(' / ');
    if(vals.members)t.members=vals.members.split(/[,，、;\/]+|\s{1,}(?![^(]*\))/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.+?)\s*\((.+)\)$/);return m?{name:m[1],team:m[2]}:{name:x,team:''};});
    if(vals.rates){const r=parseRatesText(vals.rates);t.rates=r.rates;t.errs.push(...r.errs);}
    if(/(^|\s)당일(\s|$)/.test(t.name)){t.name=t.name.replace(/(^|\s)당일(?=\s|$)/,' ').replace(/\s+/g,' ').trim();t.dayTrip=true;}
    if(t.startDate&&t.startDate===t.endDate&&/당일/.test(block))t.dayTrip=true;
    if(t.dayTrip&&t.startDate)t.endDate=t.startDate;
    if(!t.name)t.errs.push('여정명 없음');
    if(t.startDate&&t.endDate&&t.endDate<t.startDate)t.errs.push('종료일이 시작일보다 빠름');
    return t;
  });
}
function resolveMembers(list){ // [{name,team}] → ids (없는 사람은 인원 정보에 새로 등록)
  const ids=[];let created=0;
  list.forEach(m=>{let p=findPerson(m.name,m.team);if(!p&&m.team)p=findPerson(m.name,'');
    if(!p){p={id:uid(),name:m.name,group:'',team:m.team||'',phone:'',email:'',memo:'',createdAt:Date.now()};savePerson(p);created++;}
    if(!ids.includes(p.id))ids.push(p.id);});
  return{ids,created};
}

/* ---------- 지출 텍스트 입력 ---------- */
const CUR_WORDS={'원':'KRW','₩':'KRW','\\':'KRW','$':'USD','달러':'USD','불':'USD','€':'EUR','유로':'EUR','¥':'JPY','엔':'JPY','엔화':'JPY','위안':'CNY','元':'CNY','동':'VND','바트':'THB','페소':'PHP','파운드':'GBP','£':'GBP'};
function parseExpenseText(t,text,defCur,defDate){
  const rates=t.rates||[];const mr=c=>rates.find(r=>r.code===c);
  const names=(t.memberIds||[]).map(id=>({id,name:memberName(t,id)}));
  const findM=n=>{n=String(n).trim().replace(/^@/,'');if(!n)return null;let m=names.find(x=>x.name===n);
    if(!m){const c=names.filter(x=>x.name.startsWith(n));if(c.length===1)m=c[0];}return m;};
  const yr=(t.startDate||today()).slice(0,4);
  const normD=s=>{let m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m=s.match(/^(\d{1,2})[\/-](\d{1,2})$/)||s.match(/^(\d{1,2})\.(\d{1,2})\.$/)||s.match(/^(\d{1,2})월(\d{1,2})일?$/);
    if(m&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31)return `${yr}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;return null;};
  let curDate=defDate;const out=[];
  String(text||'').replace(/\r\n?/g,'\n').split('\n').forEach((raw,li)=>{
    let s=raw.trim();if(!s)return;
    const errs=[];let memo='',rateOv=null,tgt=null,exc=null;const payers=[];
    s=s.replace(/(?:메모|비고)\s*[:：]\s*(.*)$/,(_,v)=>{memo=v.trim();return'';});
    const list='([^\\s:：]+(?:\\s*,\\s*[^\\s:：,]+)*)';
    s=s.replace(new RegExp('(?:대상|인원)\\s*[:：]\\s*'+list),(_,v)=>{tgt=v;return' ';});
    s=s.replace(new RegExp('(?:제외)\\s*[:：]\\s*'+list),(_,v)=>{exc=v;return' ';});
    s=s.replace(new RegExp('(?:결제자?|결재자?)\\s*[:：]\\s*'+list),(_,v)=>{v.split(',').forEach(x=>payers.push(x));return' ';});
    s=s.replace(/환율\s*[:：]\s*([\d,.]+)/,(_,v)=>{rateOv=pnum(v);return' ';});
    let date=null,amount=null,currency=null;const words=[];
    s.split(/\s+/).filter(Boolean).forEach(tok=>{
      if(tok.startsWith('@')&&tok.length>1){tok.slice(1).split(',').forEach(x=>payers.push(x));return;}
      const d=normD(tok);if(d&&!date){date=d;return;}
      const up=tok.toUpperCase();
      if(/^[A-Z]{3}$/.test(up)&&(up==='KRW'||mr(up)||PRESETS.some(p=>p.code===up))&&amount!==null&&!currency){currency=up;return;}
      if(CUR_WORDS[tok]&&amount!==null&&!currency){currency=CUR_WORDS[tok];return;}
      const m=tok.match(/^([$€¥₩£\\])?([\d][\d,]*(?:\.\d+)?)(만)?([A-Za-z]{3}|원|달러|불|엔|엔화|위안|동|바트|유로|페소|파운드|元)?$/);
      if(m&&amount===null){amount=pnum(m[2])*(m[3]?10000:1);const c=m[1]?CUR_WORDS[m[1]]:m[4]?(CUR_WORDS[m[4]]||m[4].toUpperCase()):null;if(c)currency=c;return;}
      words.push(tok);
    });
    if(date&&amount===null&&!words.length&&!payers.length){curDate=date;return;}   // 날짜만 적은 줄
    if(date)curDate=date;
    currency=currency||defCur||'KRW';
    const item=words.join(' ');
    if(!item)errs.push('항목 없음');
    if(!(amount>0))errs.push('금액 없음');
    let rate=1,unit=1;
    if(currency!=='KRW'){const r=mr(currency);
      if(rateOv>0){rate=rateOv;unit=r?(r.unit||1):(PRESETS.find(p=>p.code===currency)?.unit||1);}
      else if(r){rate=r.rate;unit=r.unit||1;}else errs.push(`${currency} 마스터 환율 없음`);}
    let targets=[...(t.memberIds||[])];
    if(tgt&&!/^(전체|모두|all)$/i.test(tgt.trim())){targets=[];tgt.split(',').forEach(n=>{const m=findM(n);if(m)targets.includes(m.id)||targets.push(m.id);else errs.push(`대상 ‘${n.trim()}’ 없음`);});}
    if(exc)exc.split(',').forEach(n=>{const m=findM(n);if(m)targets=targets.filter(x=>x!==m.id);else errs.push(`제외 ‘${n.trim()}’ 없음`);});
    if(!targets.length)errs.push('대상 인원 없음');
    const py=[];payers.forEach(n=>{if(!n.trim())return;const m=findM(n);if(m)py.includes(m.id)||py.push(m.id);else errs.push(`결제자 ‘${n.trim()}’ 없음`);});
    out.push({line:li,raw,errs,e:{id:uid(),date:curDate,item,currency,amount:amount||0,rate,unit,targets,payers:py,memo,createdAt:Date.now()+li}});
  });
  return out;
}
function mountExpenseText(el,t,defCur){
  const tx=el.querySelector('[data-tx]'),tdate=el.querySelector('[data-tdate]'),tcur=el.querySelector('[data-tcur]');
  const sv=el.querySelector('[data-tsave]');tcur.value=defCur;
  let parsed=[];
  const setMode=m=>{S.expMode=m;el.querySelectorAll('[data-em]').forEach(b=>b.classList.toggle('on',b.dataset.em===m));
    el.querySelectorAll('[data-mode]').forEach(p=>p.hidden=p.dataset.mode!==m);
    el.querySelectorAll('[data-save]').forEach(b=>b.hidden=m==='text');sv.hidden=m!=='text';if(m==='text')tx.focus();};
  el.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>setMode(b.dataset.em));
  const nm=id=>memberName(t,id);
  const draw=()=>{parsed=parseExpenseText(t,tx.value,tcur.value,tdate.value);
    const ok=parsed.filter(p=>!p.errs.length),bad=parsed.length-ok.length,sum=ok.reduce((s,p)=>s+expKRW(p.e),0);
    el.querySelector('[data-tsum]').innerHTML=parsed.length?`인식 <b>${parsed.length}</b>건 · <span class="minus">정상 ${ok.length}건 ${won(sum)}원</span>${bad?` · <span style="color:var(--danger)">확인 필요 ${bad}건</span>`:''}`:'';
    el.querySelector('[data-tpv]').innerHTML=parsed.length?`<table><thead><tr><th class="l">일자</th><th class="l">항목</th><th>금액</th><th>원화</th><th class="l">결제자</th><th class="l">대상</th></tr></thead><tbody>${parsed.map(p=>{const e=p.e;
      return p.errs.length?`<tr><td class="l" colspan="6" style="white-space:normal"><span class="tag del">확인</span> ${esc(p.raw)}<br><span style="color:var(--danger)">${esc(p.errs.join(' · '))}</span></td></tr>`
      :`<tr><td class="l">${esc(e.date.slice(5))}</td><td class="l">${esc(e.item)}</td><td>${num(e.amount)} ${esc(e.currency)}</td><td>${won(expKRW(e))}</td><td class="l">${esc(e.payers.map(nm).join(', ')||'-')}</td><td class="l">${e.targets.length===t.memberIds.length?'전체':esc(e.targets.map(nm).join(', '))}</td></tr>`;}).join('')}</tbody></table>`:'';
    sv.disabled=!ok.length;sv.textContent=ok.length?`${ok.length}건 저장`:'저장';};
  tx.addEventListener('input',draw);tdate.addEventListener('change',draw);tcur.addEventListener('change',draw);
  sv.onclick=()=>{const ok=parsed.filter(p=>!p.errs.length);if(!ok.length)return;
    const d=clone(cur());d.expenses=d.expenses||[];
    ok.forEach(p=>{p.e.krw=Math.round(expKRW(p.e));d.expenses.push(p.e);});
    saveTrip(d);render();
    const bad=parsed.filter(p=>p.errs.length);
    if(bad.length){tx.value=bad.map(p=>p.raw).join('\n');draw();toast(`${ok.length}건 저장 · 확인이 필요한 ${bad.length}줄은 남겨 두었습니다`);}
    else{closeModal(el);toast(`${ok.length}건을 저장했습니다`);}};
  setMode(S.expMode==='text'?'text':'form');
}

/* ---------- spreadsheet ---------- */
function csvSplit(line,delim){const out=[];let cell='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;else if(ch===delim){out.push(cell);cell='';}else cell+=ch;}
  out.push(cell);return out;}
function parseGrid(text){
  const lines=String(text||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n').split('\n').filter(l=>l.trim()!=='');
  const delim=lines.some(l=>l.includes('\t'))?'\t':',';
  return lines.map(l=>csvSplit(l,delim).map(c=>c.trim()));
}
const HDR={group:['구분','분류','관계','그룹','category','group'],name:['이름','성명','name','출장자','참여자'],team:['팀','부서','소속','team','dept'],phone:['연락처','전화','전화번호','휴대폰','핸드폰','phone','tel','mobile'],email:['이메일','email','e-mail','메일'],memo:['메모','비고','memo','note'],bank:['은행','은행명','bank'],acct:['계좌번호','계좌','account'],holder:['예금주','holder']};
function rowsToPeople(grid){
  if(!grid.length)return[];
  const h=grid[0].map(x=>String(x).trim().toLowerCase());
  const idx={};Object.entries(HDR).forEach(([k,ws])=>{const i=h.findIndex(c=>ws.some(w=>c===w.toLowerCase()||c.startsWith(w.toLowerCase())));if(i>=0)idx[k]=i;});
  let rows=grid;
  if(idx.name!==undefined){rows=grid.slice(1);}else{idx.name=0;idx.team=1;idx.phone=2;idx.email=3;idx.memo=4;idx.group=5;idx.bank=6;idx.acct=7;idx.holder=8;}
  const seen=new Set();const out=[];
  rows.forEach(r=>{const g=k=>idx[k]===undefined?'':String(r[idx[k]]??'').trim();const p={name:g('name'),group:g('group'),team:g('team'),phone:g('phone'),email:g('email'),memo:g('memo'),bank:g('bank'),acct:g('acct'),holder:g('holder')};
    if(!p.name)return;const key=p.name+'|'+p.team;if(seen.has(key))return;seen.add(key);out.push(p);});
  return out;
}
/* 자유 텍스트: 한 줄(또는 쉼표)마다 한 명 · "이름 팀 연락처 이메일 메모" 순서, 공백·/·| 로 구분 */
function textToPeople(text){
  const s=String(text||'').replace(/\r\n?/g,'\n').trim(); if(!s)return[];
  if(s.includes('\t'))return rowsToPeople(parseGrid(s));
  const known=new Set([...GROUPS,...groupsInUse()]);
  const isPhone=t=>/^[+\d][\d\-\s().]{6,}$/.test(t)&&(t.match(/\d/g)||[]).length>=7;
  const isBank=t=>BANKS.includes(t)||/(은행|뱅크|농협|금고|신협|우체국)$/.test(t)||['국민','기업','농협','KB','NH','IBK','SC','카뱅','토스'].includes(t);
  const unwrap=t=>{const m=String(t).match(/^[\[(（【<]\s*(.+?)\s*[\])）】>]$/);return m?m[1]:null;};
  // "구분: 친구" / "구분 친구" / "구분=친구" → "구분:친구"
  const norm=l=>l.replace(/(계좌번호|계좌)\s*[:：=]\s*/g,'계좌:').replace(/(구분|분류|관계|그룹)\s*[:：=]?\s+(?=\S)/g,'$1:').replace(/(구분|분류|관계|그룹)\s*[:：=]\s*/g,'$1:');
  const fieldLike=seg=>{const t=seg.trim();if(!t)return true;if(/^계좌:/.test(t)||/^\S+\s+\d[\d-]{7,}$/.test(t))return true;if(/\s/.test(t))return false;
    return known.has(t)||!!unwrap(t)||isPhone(t)||/@/.test(t)||/^(구분|분류|관계|그룹):/.test(t)||/(팀|부|과|실|본부|센터|그룹|사업부)$/.test(t);};
  const entries=[];
  s.split('\n').forEach(line=>{line=norm(line.trim());if(!line)return;
    const segs=line.split(/\s*[,，;]\s*/);
    // 쉼표 뒤 조각이 구분·연락처·팀처럼 '한 칸짜리 정보'면 같은 사람의 항목으로 본다
    if(segs.length>1&&segs.slice(1).some(fieldLike))entries.push(segs.join(' / '));else entries.push(...segs);});
  const seen=new Set(),out=[];
  entries.map(e=>e.trim()).filter(Boolean).forEach(e=>{
    const toks=e.split(/\s*[\/|]\s*|\s+/).filter(Boolean);
    const p={name:'',group:'',team:'',phone:'',email:'',memo:'',bank:'',acct:'',holder:''};const rest=[];
    for(let i=0;i<toks.length-1;i++){const t=toks[i],n=toks[i+1];
      if(!p.acct&&isBank(t)&&/^\d[\d-]{5,}$/.test(n)&&(n.match(/\d/g)||[]).length>=8){p.bank=t;p.acct=n;toks.splice(i,2);i--;}}
    for(let i=0;i<toks.length;i++){const m=toks[i].match(/^(?:계좌|계좌번호)[:：](.*)$/);if(m){let v=m[1];
      if(!v&&toks[i+1]){if(isBank(toks[i+1])&&toks[i+2]){p.bank=toks[i+1];v=toks[i+2];toks.splice(i,3);}else{v=toks[i+1];toks.splice(i,2);}}
      else if(isBank(v)&&toks[i+1]){p.bank=v;v=toks[i+1];toks.splice(i,2);}else toks.splice(i,1);
      if(!p.acct)p.acct=v;i--;}}
    toks.forEach(t=>{
      const gm=t.match(/^(?:구분|분류|관계|그룹):(.+)$/);if(gm){if(!p.group)p.group=unwrap(gm[1])||gm[1];return;}
      const u=unwrap(t);if(u&&!p.group&&!isPhone(u)){p.group=u;return;}
      if(!p.group&&known.has(t)&&(rest.length||p.phone||p.email||toks.length>1)){p.group=t;return;}
      if(!p.email&&/@/.test(t)){p.email=t;return;}
      if(!p.phone&&isPhone(t)){p.phone=t;return;}
      rest.push(t);});
    p.name=rest.shift()||'';
    // 이름 다음 칸이 알려진 구분이면 구분으로 (팀보다 우선)
    if(!p.group&&rest.length&&known.has(rest[0]))p.group=rest.shift();
    p.team=rest.shift()||'';
    if(!p.group&&p.team&&known.has(p.team)){p.group=p.team;p.team=rest.shift()||'';}
    p.memo=rest.join(' ');
    if(!p.name)return;const key=p.name+'|'+p.team;if(seen.has(key))return;seen.add(key);out.push(p);
  });
  return out;
}
function findPerson(name,team,pool){pool=pool||Object.values(S.people);
  let m=pool.find(p=>p.name===name&&(p.team||'')===(team||''));
  if(!m&&!team){const c=pool.filter(p=>p.name===name);if(c.length===1)m=c[0];}
  return m;}
function planImport(rows,mode){
  const plan=[];const matched=new Set();
  rows.forEach(r=>{const m=findPerson(r.name,r.team);
    if(m){matched.add(m.id);const next={...clone(m),id:m.id};let ch=false;['group','team','phone','email','memo','bank','acct','holder'].forEach(k=>{if(r[k]&&r[k]!==(m[k]||'')){next[k]=r[k];ch=true;}});plan.push({type:ch?'upd':'same',row:r,person:next});}
    else plan.push({type:'new',row:r,person:{id:uid(),...r,createdAt:Date.now()}});});
  const dels=mode==='replace'?Object.values(S.people).filter(p=>!matched.has(p.id)):[];
  return{plan,dels};
}
function readFileGrid(file){
  return new Promise((res,rej)=>{const fr=new FileReader();const nm=file.name.toLowerCase();
    if(/\.(csv|tsv|txt)$/.test(nm)){fr.onload=()=>res(parseGrid(fr.result));fr.onerror=rej;fr.readAsText(file,'utf-8');}
    else{if(!window.XLSX){rej(new Error('엑셀 라이브러리를 불러오지 못했습니다. CSV로 저장하거나 붙여넣기를 이용하세요.'));return;}
      fr.onload=()=>{try{const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});const name=wb.SheetNames.find(n=>/인원|출장자|명단/.test(n))||wb.SheetNames[0];
        res(XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false}).map(r=>r.map(c=>String(c).trim())).filter(r=>r.some(c=>c!=='')));}catch(e){rej(e);}};
      fr.onerror=rej;fr.readAsArrayBuffer(file);}});
}

function tripSheets(t){
  const c=calc(t),ids=t.memberIds||[],nm=id=>memberName(t,id),ex=sortedExp(t);
  const info=[['항목','내용'],['출장명',t.name],['구분',planScope(t)==='dom'?'국내':'해외'],['시작일',t.startDate],['종료일',t.endDate],['업체명',t.company||''],['목적',t.purpose||''],['국가',t.country||''],['도시',t.city||(t.country?'':t.location||'')],['메모',t.memo||''],['총 비용(원)',Math.round(c.total)],['1인 평균(원)',Math.round(c.avg)],['출장자 수',ids.length]];
  const mem=[['이름','팀','연락처','이메일','구분'],...ids.map(id=>{const p=S.people[id]||{};return[nm(id),memberTeam(t,id),p.phone||'',p.email||'',p.group||''];})];
  const rates=[['통화코드','통화명','단위','환율(원)'],...(t.rates||[]).map(r=>[r.code,r.name||'',r.unit||1,r.rate])];
  const exp=[['일자','항목','통화','금액','단위','결제환율','원화금액','대상인원','결제자','메모'],...ex.map(e=>[e.date||'',e.item,e.currency||'KRW',pnum(e.amount),pnum(e.unit)||1,pnum(e.rate)||1,Math.round(expKRW(e)),(e.targets||[]).map(nm).join(', '),(e.payers||[]).map(nm).join(', '),e.memo||''])];
  const settle=[['이름','팀','부담액(+)','결제액(-)','정산합계'],...ids.map(id=>{const v=c.per[id];return[nm(id),memberTeam(t,id),Math.round(v.share),-Math.round(v.paid),Math.round(v.net)];})];
  const ac=t.accounts||[]; if(ac.length){settle.push([]);settle.push(['입금 계좌','은행','계좌번호','예금주','메모']);ac.forEach(a=>settle.push([a.memberId?nm(a.memberId):(a.label||''),a.bank,a.number,a.holder||'',a.memo||'']));}
  const tx=transfers(c,ids); if(tx.length){settle.push([]);settle.push(['보내는 사람','받는 사람','금액(원)','받는 계좌']);tx.forEach(x=>{const a=acctOf(t,x.to);settle.push([nm(x.from),nm(x.to),x.a,a?acctText(a):'']);});}
  const matrix=[['일자','항목','원화금액',...ids.map(nm)],...ex.map(e=>{const k=expKRW(e),tg=e.targets||[],py=e.payers||[];return[e.date||'',e.item,Math.round(k),...ids.map(id=>{let v=0;if(tg.includes(id))v+=k/tg.length;if(py.includes(id))v-=k/py.length;return Math.round(v);})];}),['','정산합계',Math.round(c.total),...ids.map(id=>Math.round(c.per[id].net))]];
  return[['출장정보',info],['출장자',mem],['환율',rates],['지출내역',exp],['정산',settle],['분담표',matrix]];
}

function normDate(v){
  if(v===undefined||v===null||v==='')return'';
  if(typeof v==='number'&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;}
  const s=String(v).trim().replace(/[./]/g,'-').replace(/\s/g,'');const m=s.match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})/);
  if(m){const y=m[1].length===2?'20'+m[1]:m[1];return `${y}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;}return s;
}

function parseTripWB(wb){
  const get=n=>{const k=wb.SheetNames.find(s=>s.trim()===n);return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,defval:''}):null;};
  const info=get('출장정보');if(!info)throw new Error("'출장정보' 시트가 없습니다. 이 프로그램에서 내보낸 형식인지 확인하세요.");
  const kv={};info.slice(1).forEach(r=>kv[String(r[0]).trim()]=r[1]);
  const t={id:uid(),scope:kv['구분']?(/국내/.test(String(kv['구분']))?'dom':'intl'):undefined,name:String(kv['출장명']||'가져온 출장').trim(),startDate:normDate(kv['시작일']),endDate:normDate(kv['종료일']),company:String(kv['업체명']||''),purpose:String(kv['목적']||''),location:String(kv['장소']||''),city:String(kv['도시']||''),country:String(kv['국가']||''),memo:String(kv['메모']||''),memberIds:[],members:[],rates:[],expenses:[],createdAt:Date.now()};
  if(!t.city&&!t.country&&t.location){const sp=splitPlace(t.location);t.city=sp.city;t.country=sp.country;}
  t.location=[t.city,t.country].filter(Boolean).join(', ')||t.location;
  const members=(get('출장자')||[]).slice(1).filter(r=>String(r[0]).trim()).map(r=>({name:String(r[0]).trim(),team:String(r[1]||'').trim(),phone:String(r[2]||''),email:String(r[3]||''),group:String(r[4]||'').trim()}));
  t.rates=(get('환율')||[]).slice(1).filter(r=>String(r[0]).trim()).map(r=>{const code=String(r[0]).trim().toUpperCase();return{code,name:String(r[1]||PRESETS.find(p=>p.code===code)?.name||code),unit:pnum(r[2])||1,rate:pnum(r[3])};}).filter(r=>r.rate>0&&r.code!=='KRW');
  const exp=(get('지출내역')||[]).slice(1).filter(r=>String(r[1]).trim()&&pnum(r[3])>0).map(r=>{const c=String(r[2]||'KRW').trim().toUpperCase()||'KRW';
    return{date:normDate(r[0]),item:String(r[1]).trim(),currency:c,amount:pnum(r[3]),unit:c==='KRW'?1:(pnum(r[4])||1),rate:c==='KRW'?1:(pnum(r[5])||t.rates.find(x=>x.code===c)?.rate||0),targets:r[7],payers:r[8],memo:String(r[9]||'')};});
  return{t,members,exp};
}
